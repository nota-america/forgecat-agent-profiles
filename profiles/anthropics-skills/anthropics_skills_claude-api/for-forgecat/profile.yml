name: "@forgecat/anthropics_skills_claude-api"
version: 0.0.4
description: 'Build, debug, and optimize Claude API / Anthropic SDK apps. Apps built
  with this skill should include prompt caching. Also handles migrating existing Claude
  API code between Claude model versions (4.5 → 4.6, 4.6 → 4.7, retired-model replacements).
  TRIGGER when: code imports `anthropic`/`@anthropic-ai/sdk`; user asks for the Claude
  API, Anthropic SDK, or Managed Agents; user adds/modifies/tunes a Claude feature
  (caching, thinking, compaction, tool use, batch, files, citations, memory) or model
  (Opus/Sonnet/Haiku) in a file; questions about prompt caching / cache hit rate in
  an Anthropic SDK project. SKIP: file imports `openai`/other-provider SDK, filename
  like `*-openai.py`/`*-generic.py`, provider-neutral code, general programming/ML.'
repository: https://github.com/anthropics/skills
license: Complete terms in LICENSE.txt
visibility: public
compatibility:
  platforms:
    tested:
      - claude-code
      - cursor
      - codex
  models:
    recommended: []
    minimum: []
