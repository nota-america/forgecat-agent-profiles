name: "@forgecat/anthropics_skills_skill-creator"
version: 0.0.4
description: Create new skills, modify and improve existing skills, and measure skill
  performance. Use when users want to create a skill from scratch, edit, or optimize
  an existing skill, run evals to test a skill, benchmark skill performance with variance
  analysis, or optimize a skill's description for better triggering accuracy.
repository: https://github.com/anthropics/skills
license: MIT
visibility: public
compatibility:
  platforms:
    tested:
      - claude-code
      - cursor
      - codex
  models:
    recommended: []
    minimum: []
skills:
- name: skill-creator
  path: skills/skill-creator/SKILL.md
  description: Create new skills, modify and improve existing skills, and measure
    skill performance. Use when users want to create a skill from scratch, edit, or
    optimize an existing skill, run evals to test a skill, benchmark skill performance
    with variance analysis, or optimize a skill's description for better triggering
    accuracy.
  scripts:
  - path: skills/skill-creator/eval-viewer/generate_review.py
  - path: skills/skill-creator/scripts/__init__.py
  - path: skills/skill-creator/scripts/aggregate_benchmark.py
  - path: skills/skill-creator/scripts/generate_report.py
  - path: skills/skill-creator/scripts/improve_description.py
  - path: skills/skill-creator/scripts/package_skill.py
  - path: skills/skill-creator/scripts/quick_validate.py
  - path: skills/skill-creator/scripts/run_eval.py
  - path: skills/skill-creator/scripts/run_loop.py
  - path: skills/skill-creator/scripts/utils.py
