name: "@forgecat/humanizer-zh"
description: >-
  Humanizer-zh is a Chinese Claude Code skill for editing AI-generated text into more natural, human-sounding writing by detecting and rewriting common AI writing patterns.
repository: https://github.com/op7418/humanizer-zh
license: MIT
visibility: public
sourcePlatform: claude-code
compatibility:
  platforms:
    tested: []
    partial:
      - claude-code
      - cursor
      - codex
  models:
    recommended: []
    minimum: []
skills:
  - name: humanizer-zh
    path: skills/humanizer-zh/SKILL.md
    description: |-
      去除文本中的 AI 生成痕迹。适用于编辑或审阅文本，使其听起来更自然、更像人类书写。
      基于维基百科的"AI 写作特征"综合指南。检测并修复以下模式：夸大的象征意义、
      宣传性语言、以 -ing 结尾的肤浅分析、模糊的归因、破折号过度使用、三段式法则、
      AI 词汇、否定式排比、过多的连接性短语。
