name: "@forgecat/orchestra-research_ai-research-skills"
description: Comprehensive AI research skill library for autonomous research workflows,
  model training, evaluation, inference, MLOps, RAG, multimodal systems, and paper
  writing.
repository: https://github.com/Orchestra-Research/AI-Research-SKILLs
license: MIT
visibility: public
sourcePlatform: claude-code
compatibility:
  platforms:
    tested:
    - claude-code
    - codex
    partial:
    - cursor
  models:
    recommended: []
    minimum: []
skills:
- name: autoresearch
  path: skills/ai-research-skills/0-autoresearch-skill/SKILL.md
  description: Orchestrates end-to-end autonomous AI research projects using a two-loop
    architecture. The inner loop runs rapid experiment iterations with clear optimization
    targets. The outer loop synthesizes results, identifies patterns, and steers research
    direction. Routes to domain-specific skills for execution, supports continuous
    agent operation via Claude Code /loop and OpenClaw heartbeat, and produces research
    presentations and papers. Use when starting a research project, running autonomous
    experiments, or managing a multi-hypothesis research effort.
- name: implementing-llms-litgpt
  path: skills/ai-research-skills/01-model-architecture/litgpt/SKILL.md
  description: Implements and trains LLMs using Lightning AI's LitGPT with 20+ pretrained
    architectures (Llama, Gemma, Phi, Qwen, Mistral). Use when need clean model implementations,
    educational understanding of architectures, or production fine-tuning with LoRA/QLoRA.
    Single-file implementations, no abstraction layers.
  dependencies:
  - litgpt
  - torch
  - transformers
- name: mamba-architecture
  path: skills/ai-research-skills/01-model-architecture/mamba/SKILL.md
  description: State-space model with O(n) complexity vs Transformers' O(n²). 5× faster
    inference, million-token sequences, no KV cache. Selective SSM with hardware-aware
    design. Mamba-1 (d_state=16) and Mamba-2 (d_state=128, multi-head). Models 130M-2.8B
    on HuggingFace.
  dependencies:
  - mamba-ssm
  - torch
  - transformers
  - causal-conv1d
- name: nanogpt
  path: skills/ai-research-skills/01-model-architecture/nanogpt/SKILL.md
  description: Educational GPT implementation in ~300 lines. Reproduces GPT-2 (124M)
    on OpenWebText. Clean, hackable code for learning transformers. By Andrej Karpathy.
    Perfect for understanding GPT architecture from scratch. Train on Shakespeare
    (CPU) or OpenWebText (multi-GPU).
  dependencies:
  - torch
  - transformers
  - datasets
  - tiktoken
  - wandb
- name: rwkv-architecture
  path: skills/ai-research-skills/01-model-architecture/rwkv/SKILL.md
  description: RNN+Transformer hybrid with O(n) inference. Linear time, infinite context,
    no KV cache. Train like GPT (parallel), infer like RNN (sequential). Linux Foundation
    AI project. Production at Windows, Office, NeMo. RWKV-7 (March 2025). Models up
    to 14B parameters.
  dependencies:
  - rwkv
  - torch
  - transformers
- name: distributed-llm-pretraining-torchtitan
  path: skills/ai-research-skills/01-model-architecture/torchtitan/SKILL.md
  description: Provides PyTorch-native distributed LLM pretraining using torchtitan
    with 4D parallelism (FSDP2, TP, PP, CP). Use when pretraining Llama 3.1, DeepSeek
    V3, or custom models at scale from 8 to 512+ GPUs with Float8, torch.compile,
    and distributed checkpointing.
  dependencies:
  - torch>=2.6.0
  - torchtitan>=0.2.0
  - torchao>=0.5.0
- name: huggingface-tokenizers
  path: skills/ai-research-skills/02-tokenization/huggingface-tokenizers/SKILL.md
  description: Fast tokenizers optimized for research and production. Rust-based implementation
    tokenizes 1GB in <20 seconds. Supports BPE, WordPiece, and Unigram algorithms.
    Train custom vocabularies, track alignments, handle padding/truncation. Integrates
    seamlessly with transformers. Use when you need high-performance tokenization
    or custom tokenizer training.
  dependencies:
  - tokenizers
  - transformers
  - datasets
- name: sentencepiece
  path: skills/ai-research-skills/02-tokenization/sentencepiece/SKILL.md
  description: Language-independent tokenizer treating text as raw Unicode. Supports
    BPE and Unigram algorithms. Fast (50k sentences/sec), lightweight (6MB memory),
    deterministic vocabulary. Used by T5, ALBERT, XLNet, mBART. Train on raw text
    without pre-tokenization. Use when you need multilingual support, CJK languages,
    or reproducible tokenization.
  dependencies:
  - sentencepiece
  - transformers
- name: axolotl
  path: skills/ai-research-skills/03-fine-tuning/axolotl/SKILL.md
  description: Expert guidance for fine-tuning LLMs with Axolotl - YAML configs, 100+
    models, LoRA/QLoRA, DPO/KTO/ORPO/GRPO, multimodal support
  dependencies:
  - axolotl
  - torch
  - transformers
  - datasets
  - peft
  - accelerate
  - deepspeed
- name: llama-factory
  path: skills/ai-research-skills/03-fine-tuning/llama-factory/SKILL.md
  description: Expert guidance for fine-tuning LLMs with LLaMA-Factory - WebUI no-code,
    100+ models, 2/3/4/5/6/8-bit QLoRA, multimodal support
  dependencies:
  - llmtuner
  - torch
  - transformers
  - datasets
  - peft
  - accelerate
  - gradio
- name: peft-fine-tuning
  path: skills/ai-research-skills/03-fine-tuning/peft/SKILL.md
  description: Parameter-efficient fine-tuning for LLMs using LoRA, QLoRA, and 25+
    methods. Use when fine-tuning large models (7B-70B) with limited GPU memory, when
    you need to train <1% of parameters with minimal accuracy loss, or for multi-adapter
    serving. HuggingFace's official library integrated with transformers ecosystem.
  dependencies:
  - peft>=0.13.0
  - transformers>=4.45.0
  - torch>=2.0.0
  - bitsandbytes>=0.43.0
- name: unsloth
  path: skills/ai-research-skills/03-fine-tuning/unsloth/SKILL.md
  description: Expert guidance for fast fine-tuning with Unsloth - 2-5x faster training,
    50-80% less memory, LoRA/QLoRA optimization
  dependencies:
  - unsloth
  - torch
  - transformers
  - trl
  - datasets
  - peft
- name: nnsight-remote-interpretability
  path: skills/ai-research-skills/04-mechanistic-interpretability/nnsight/SKILL.md
  description: Provides guidance for interpreting and manipulating neural network
    internals using nnsight with optional NDIF remote execution. Use when needing
    to run interpretability experiments on massive models (70B+) without local GPU
    resources, or when working with any PyTorch architecture.
  dependencies:
  - nnsight>=0.5.0
  - torch>=2.0.0
- name: pyvene-interventions
  path: skills/ai-research-skills/04-mechanistic-interpretability/pyvene/SKILL.md
  description: Provides guidance for performing causal interventions on PyTorch models
    using pyvene's declarative intervention framework. Use when conducting causal
    tracing, activation patching, interchange intervention training, or testing causal
    hypotheses about model behavior.
  dependencies:
  - pyvene>=0.1.8
  - torch>=2.0.0
  - transformers>=4.30.0
- name: sparse-autoencoder-training
  path: skills/ai-research-skills/04-mechanistic-interpretability/saelens/SKILL.md
  description: Provides guidance for training and analyzing Sparse Autoencoders (SAEs)
    using SAELens to decompose neural network activations into interpretable features.
    Use when discovering interpretable features, analyzing superposition, or studying
    monosemantic representations in language models.
  dependencies:
  - sae-lens>=6.0.0
  - transformer-lens>=2.0.0
  - torch>=2.0.0
- name: transformer-lens-interpretability
  path: skills/ai-research-skills/04-mechanistic-interpretability/transformer-lens/SKILL.md
  description: Provides guidance for mechanistic interpretability research using TransformerLens
    to inspect and manipulate transformer internals via HookPoints and activation
    caching. Use when reverse-engineering model algorithms, studying attention patterns,
    or performing activation patching experiments.
  dependencies:
  - transformer-lens>=2.0.0
  - torch>=2.0.0
- name: nemo-curator
  path: skills/ai-research-skills/05-data-processing/nemo-curator/SKILL.md
  description: GPU-accelerated data curation for LLM training. Supports text/image/video/audio.
    Features fuzzy deduplication (16× faster), quality filtering (30+ heuristics),
    semantic deduplication, PII redaction, NSFW detection. Scales across GPUs with
    RAPIDS. Use for preparing high-quality training datasets, cleaning web data, or
    deduplicating large corpora.
  dependencies:
  - nemo-curator
  - cudf
  - dask
  - rapids
- name: ray-data
  path: skills/ai-research-skills/05-data-processing/ray-data/SKILL.md
  description: Scalable data processing for ML workloads. Streaming execution across
    CPU/GPU, supports Parquet/CSV/JSON/images. Integrates with Ray Train, PyTorch,
    TensorFlow. Scales from single machine to 100s of nodes. Use for batch inference,
    data preprocessing, multi-modal data loading, or distributed ETL pipelines.
  dependencies:
  - ray[data]
  - pyarrow
  - pandas
- name: grpo-rl-training
  path: skills/ai-research-skills/06-post-training/grpo-rl-training/SKILL.md
  description: Expert guidance for GRPO/RL fine-tuning with TRL for reasoning and
    task-specific model training
  dependencies:
  - transformers>=4.47.0
  - trl>=0.14.0
  - datasets>=3.2.0
  - peft>=0.14.0
  - torch
  scripts:
  - path: skills/ai-research-skills/06-post-training/grpo-rl-training/examples/reward_functions_library.py
  - path: skills/ai-research-skills/06-post-training/grpo-rl-training/templates/basic_grpo_training.py
- name: miles-rl-training
  path: skills/ai-research-skills/06-post-training/miles/SKILL.md
  description: Provides guidance for enterprise-grade RL training using miles, a production-ready
    fork of slime. Use when training large MoE models with FP8/INT4, needing train-inference
    alignment, or requiring speculative RL for maximum throughput.
  dependencies:
  - sglang-router>=0.2.3
  - ray
  - torch>=2.0.0
  - transformers>=4.40.0
- name: openrlhf-training
  path: skills/ai-research-skills/06-post-training/openrlhf/SKILL.md
  description: High-performance RLHF framework with Ray+vLLM acceleration. Use for
    PPO, GRPO, RLOO, DPO training of large models (7B-70B+). Built on Ray, vLLM, ZeRO-3.
    2× faster than DeepSpeedChat with distributed architecture and GPU resource sharing.
  dependencies:
  - openrlhf
  - ray
  - vllm
  - torch
  - transformers
  - deepspeed
- name: simpo-training
  path: skills/ai-research-skills/06-post-training/simpo/SKILL.md
  description: Simple Preference Optimization for LLM alignment. Reference-free alternative
    to DPO with better performance (+6.4 points on AlpacaEval 2.0). No reference model
    needed, more efficient than DPO. Use for preference alignment when want simpler,
    faster training than DPO/PPO.
  dependencies:
  - torch
  - transformers
  - datasets
  - trl
  - accelerate
- name: slime-rl-training
  path: skills/ai-research-skills/06-post-training/slime/SKILL.md
  description: Provides guidance for LLM post-training with RL using slime, a Megatron+SGLang
    framework. Use when training GLM models, implementing custom data generation workflows,
    or needing tight Megatron-LM integration for RL scaling.
  dependencies:
  - sglang-router>=0.2.3
  - ray
  - torch>=2.0.0
  - transformers>=4.40.0
- name: torchforge-rl-training
  path: skills/ai-research-skills/06-post-training/torchforge/SKILL.md
  description: Provides guidance for PyTorch-native agentic RL using torchforge, Meta's
    library separating infra from algorithms. Use when you want clean RL abstractions,
    easy algorithm experimentation, or scalable training with Monarch and TorchTitan.
  dependencies:
  - torch>=2.9.0
  - torchtitan>=0.2.0
  - vllm
  - monarch
- name: fine-tuning-with-trl
  path: skills/ai-research-skills/06-post-training/trl-fine-tuning/SKILL.md
  description: Fine-tune LLMs using reinforcement learning with TRL - SFT for instruction
    tuning, DPO for preference alignment, PPO/GRPO for reward optimization, and reward
    model training. Use when need RLHF, align model with preferences, or train from
    human feedback. Works with HuggingFace Transformers.
  dependencies:
  - trl
  - transformers
  - datasets
  - peft
  - accelerate
  - torch
- name: verl-rl-training
  path: skills/ai-research-skills/06-post-training/verl/SKILL.md
  description: Provides guidance for training LLMs with reinforcement learning using
    verl (Volcano Engine RL). Use when implementing RLHF, GRPO, PPO, or other RL algorithms
    for LLM post-training at scale with flexible infrastructure backends.
  dependencies:
  - verl>=0.3.0
  - torch>=2.0.0
  - ray>=2.41.0
  - vllm>=0.8.2
  - transformers>=4.40.0
- name: constitutional-ai
  path: skills/ai-research-skills/07-safety-alignment/constitutional-ai/SKILL.md
  description: Anthropic's method for training harmless AI through self-improvement.
    Two-phase approach - supervised learning with self-critique/revision, then RLAIF
    (RL from AI Feedback). Use for safety alignment, reducing harmful outputs without
    human labels. Powers Claude's safety system.
  dependencies:
  - transformers
  - torch
  - trl
- name: llamaguard
  path: skills/ai-research-skills/07-safety-alignment/llamaguard/SKILL.md
  description: Meta's 7-8B specialized moderation model for LLM input/output filtering.
    6 safety categories - violence/hate, sexual content, weapons, substances, self-harm,
    criminal planning. 94-95% accuracy. Deploy with vLLM, HuggingFace, Sagemaker.
    Integrates with NeMo Guardrails.
  dependencies:
  - transformers
  - torch
  - vllm
- name: nemo-guardrails
  path: skills/ai-research-skills/07-safety-alignment/nemo-guardrails/SKILL.md
  description: NVIDIA's runtime safety framework for LLM applications. Features jailbreak
    detection, input/output validation, fact-checking, hallucination detection, PII
    filtering, toxicity detection. Uses Colang 2.0 DSL for programmable rails. Production-ready,
    runs on T4 GPU.
  dependencies:
  - nemoguardrails
- name: prompt-guard
  path: skills/ai-research-skills/07-safety-alignment/prompt-guard/SKILL.md
  description: Meta's 86M prompt injection and jailbreak detector. Filters malicious
    prompts and third-party data for LLM apps. 99%+ TPR, <1% FPR. Fast (<2ms GPU).
    Multilingual (8 languages). Deploy with HuggingFace or batch processing for RAG
    security.
  dependencies:
  - transformers
  - torch
- name: huggingface-accelerate
  path: skills/ai-research-skills/08-distributed-training/accelerate/SKILL.md
  description: Simplest distributed training API. 4 lines to add distributed support
    to any PyTorch script. Unified API for DeepSpeed/FSDP/Megatron/DDP. Automatic
    device placement, mixed precision (FP16/BF16/FP8). Interactive config, single
    launch command. HuggingFace ecosystem standard.
  dependencies:
  - accelerate
  - torch
  - transformers
- name: deepspeed
  path: skills/ai-research-skills/08-distributed-training/deepspeed/SKILL.md
  description: Expert guidance for distributed training with DeepSpeed - ZeRO optimization
    stages, pipeline parallelism, FP16/BF16/FP8, 1-bit Adam, sparse attention
  dependencies:
  - deepspeed
  - torch
  - transformers
  - accelerate
- name: training-llms-megatron
  path: skills/ai-research-skills/08-distributed-training/megatron-core/SKILL.md
  description: Trains large language models (2B-462B parameters) using NVIDIA Megatron-Core
    with advanced parallelism strategies. Use when training models >1B parameters,
    need maximum GPU efficiency (47% MFU on H100), or require tensor/pipeline/sequence/context/expert
    parallelism. Production-ready framework used for Nemotron, LLaMA, DeepSeek.
  dependencies:
  - megatron-core
  - torch
  - apex
  - transformer-engine
- name: pytorch-fsdp2
  path: skills/ai-research-skills/08-distributed-training/pytorch-fsdp2/SKILL.md
  description: Adds PyTorch FSDP2 (fully_shard) to training scripts with correct init,
    sharding, mixed precision/offload config, and distributed checkpointing. Use when
    models exceed single-GPU memory or when you need DTensor-based sharding with DeviceMesh.
  dependencies:
  - torch
- name: pytorch-lightning
  path: skills/ai-research-skills/08-distributed-training/pytorch-lightning/SKILL.md
  description: High-level PyTorch framework with Trainer class, automatic distributed
    training (DDP/FSDP/DeepSpeed), callbacks system, and minimal boilerplate. Scales
    from laptop to supercomputer with same code. Use when you want clean training
    loops with built-in best practices.
  dependencies:
  - lightning
  - torch
  - transformers
- name: ray-train
  path: skills/ai-research-skills/08-distributed-training/ray-train/SKILL.md
  description: Distributed training orchestration across clusters. Scales PyTorch/TensorFlow/HuggingFace
    from laptop to 1000s of nodes. Built-in hyperparameter tuning with Ray Tune, fault
    tolerance, elastic scaling. Use when training massive models across multiple machines
    or running distributed hyperparameter sweeps.
  dependencies:
  - ray[train]
  - torch
  - transformers
- name: lambda-labs-gpu-cloud
  path: skills/ai-research-skills/09-infrastructure/lambda-labs/SKILL.md
  description: Reserved and on-demand GPU cloud instances for ML training and inference.
    Use when you need dedicated GPU instances with simple SSH access, persistent filesystems,
    or high-performance multi-node clusters for large-scale training.
  dependencies:
  - lambda-cloud-client>=1.0.0
- name: modal-serverless-gpu
  path: skills/ai-research-skills/09-infrastructure/modal/SKILL.md
  description: Serverless GPU cloud platform for running ML workloads. Use when you
    need on-demand GPU access without infrastructure management, deploying ML models
    as APIs, or running batch jobs with automatic scaling.
  dependencies:
  - modal>=0.64.0
- name: skypilot-multi-cloud-orchestration
  path: skills/ai-research-skills/09-infrastructure/skypilot/SKILL.md
  description: Multi-cloud orchestration for ML workloads with automatic cost optimization.
    Use when you need to run training or batch jobs across multiple clouds, leverage
    spot instances with auto-recovery, or optimize GPU costs across providers.
  dependencies:
  - skypilot>=0.7.0
- name: awq-quantization
  path: skills/ai-research-skills/10-optimization/awq/SKILL.md
  description: Activation-aware weight quantization for 4-bit LLM compression with
    3x speedup and minimal accuracy loss. Use when deploying large models (7B-70B)
    on limited GPU memory, when you need faster inference than GPTQ with better accuracy
    preservation, or for instruction-tuned and multimodal models. MLSys 2024 Best
    Paper Award winner.
  dependencies:
  - autoawq
  - transformers>=4.45.0
  - torch>=2.0.0
- name: quantizing-models-bitsandbytes
  path: skills/ai-research-skills/10-optimization/bitsandbytes/SKILL.md
  description: Quantizes LLMs to 8-bit or 4-bit for 50-75% memory reduction with minimal
    accuracy loss. Use when GPU memory is limited, need to fit larger models, or want
    faster inference. Supports INT8, NF4, FP4 formats, QLoRA training, and 8-bit optimizers.
    Works with HuggingFace Transformers.
  dependencies:
  - bitsandbytes
  - transformers
  - accelerate
  - torch
- name: optimizing-attention-flash
  path: skills/ai-research-skills/10-optimization/flash-attention/SKILL.md
  description: Optimizes transformer attention with Flash Attention for 2-4x speedup
    and 10-20x memory reduction. Use when training/running transformers with long
    sequences (>512 tokens), encountering GPU memory issues with attention, or need
    faster inference. Supports PyTorch native SDPA, flash-attn library, H100 FP8,
    and sliding window attention.
  dependencies:
  - flash-attn
  - torch
  - transformers
- name: gguf-quantization
  path: skills/ai-research-skills/10-optimization/gguf/SKILL.md
  description: GGUF format and llama.cpp quantization for efficient CPU/GPU inference.
    Use when deploying models on consumer hardware, Apple Silicon, or when needing
    flexible quantization from 2-8 bit without GPU requirements.
  dependencies:
  - llama-cpp-python>=0.2.0
- name: gptq
  path: skills/ai-research-skills/10-optimization/gptq/SKILL.md
  description: Post-training 4-bit quantization for LLMs with minimal accuracy loss.
    Use for deploying large models (70B, 405B) on consumer GPUs, when you need 4×
    memory reduction with <2% perplexity degradation, or for faster inference (3-4×
    speedup) vs FP16. Integrates with transformers and PEFT for QLoRA fine-tuning.
  dependencies:
  - auto-gptq
  - transformers
  - optimum
  - peft
- name: hqq-quantization
  path: skills/ai-research-skills/10-optimization/hqq/SKILL.md
  description: Half-Quadratic Quantization for LLMs without calibration data. Use
    when quantizing models to 4/3/2-bit precision without needing calibration datasets,
    for fast quantization workflows, or when deploying with vLLM or HuggingFace Transformers.
  dependencies:
  - hqq>=0.2.0
  - torch>=2.0.0
- name: ml-training-recipes
  path: skills/ai-research-skills/10-optimization/ml-training-recipes/SKILL.md
  description: Battle-tested PyTorch training recipes for all domains — LLMs, vision,
    diffusion, medical imaging, protein/drug discovery, spatial omics, genomics. Covers
    training loops, optimizer selection (AdamW, Muon), LR scheduling, mixed precision,
    debugging, and systematic experimentation. Use when training or fine-tuning neural
    networks, debugging loss spikes or OOM, choosing architectures, or optimizing
    GPU throughput.
  dependencies:
  - torch>=2.0.0
- name: evaluating-code-models
  path: skills/ai-research-skills/11-evaluation/bigcode-evaluation-harness/SKILL.md
  description: Evaluates code generation models across HumanEval, MBPP, MultiPL-E,
    and 15+ benchmarks with pass@k metrics. Use when benchmarking code models, comparing
    coding abilities, testing multi-language support, or measuring code generation
    quality. Industry standard from BigCode Project used by HuggingFace leaderboards.
  dependencies:
  - bigcode-evaluation-harness
  - transformers>=4.25.1
  - accelerate>=0.13.2
  - datasets>=2.6.1
- name: evaluating-llms-harness
  path: skills/ai-research-skills/11-evaluation/lm-evaluation-harness/SKILL.md
  description: Evaluates LLMs across 60+ academic benchmarks (MMLU, HumanEval, GSM8K,
    TruthfulQA, HellaSwag). Use when benchmarking model quality, comparing models,
    reporting academic results, or tracking training progress. Industry standard used
    by EleutherAI, HuggingFace, and major labs. Supports HuggingFace, vLLM, APIs.
  dependencies:
  - lm-eval
  - transformers
  - vllm
- name: nemo-evaluator-sdk
  path: skills/ai-research-skills/11-evaluation/nemo-evaluator/SKILL.md
  description: Evaluates LLMs across 100+ benchmarks from 18+ harnesses (MMLU, HumanEval,
    GSM8K, safety, VLM) with multi-backend execution. Use when needing scalable evaluation
    on local Docker, Slurm HPC, or cloud platforms. NVIDIA's enterprise-grade platform
    with container-first architecture for reproducible benchmarking.
  dependencies:
  - nemo-evaluator-launcher>=0.1.25
  - docker
- name: llama-cpp
  path: skills/ai-research-skills/12-inference-serving/llama-cpp/SKILL.md
  description: Runs LLM inference on CPU, Apple Silicon, and consumer GPUs without
    NVIDIA hardware. Use for edge deployment, M1/M2/M3 Macs, AMD/Intel GPUs, or when
    CUDA is unavailable. Supports GGUF quantization (1.5-8 bit) for reduced memory
    and 4-10× speedup vs PyTorch on CPU.
  dependencies:
  - llama-cpp-python
- name: sglang
  path: skills/ai-research-skills/12-inference-serving/sglang/SKILL.md
  description: Fast structured generation and serving for LLMs with RadixAttention
    prefix caching. Use for JSON/regex outputs, constrained decoding, agentic workflows
    with tool calls, or when you need 5× faster inference than vLLM with prefix sharing.
    Powers 300,000+ GPUs at xAI, AMD, NVIDIA, and LinkedIn.
  dependencies:
  - sglang
  - torch
  - transformers
- name: tensorrt-llm
  path: skills/ai-research-skills/12-inference-serving/tensorrt-llm/SKILL.md
  description: Optimizes LLM inference with NVIDIA TensorRT for maximum throughput
    and lowest latency. Use for production deployment on NVIDIA GPUs (A100/H100),
    when you need 10-100x faster inference than PyTorch, or for serving models with
    quantization (FP8/INT4), in-flight batching, and multi-GPU scaling.
  dependencies:
  - tensorrt-llm
  - torch
- name: serving-llms-vllm
  path: skills/ai-research-skills/12-inference-serving/vllm/SKILL.md
  description: Serves LLMs with high throughput using vLLM's PagedAttention and continuous
    batching. Use when deploying production LLM APIs, optimizing inference latency/throughput,
    or serving models with limited GPU memory. Supports OpenAI-compatible endpoints,
    quantization (GPTQ/AWQ/FP8), and tensor parallelism.
  dependencies:
  - vllm
  - torch
  - transformers
- name: mlflow
  path: skills/ai-research-skills/13-mlops/mlflow/SKILL.md
  description: Track ML experiments, manage model registry with versioning, deploy
    models to production, and reproduce experiments with MLflow - framework-agnostic
    ML lifecycle platform
  dependencies:
  - mlflow
  - sqlalchemy
  - boto3
- name: experiment-tracking-swanlab
  path: skills/ai-research-skills/13-mlops/swanlab/SKILL.md
  description: Provides guidance for experiment tracking with SwanLab. Use when you
    need open-source run tracking, local or self-hosted dashboards, and lightweight
    media logging for ML workflows.
  dependencies:
  - swanlab>=0.7.11
  - pillow>=9.0.0
  - soundfile>=0.12.0
- name: tensorboard
  path: skills/ai-research-skills/13-mlops/tensorboard/SKILL.md
  description: Visualize training metrics, debug models with histograms, compare experiments,
    visualize model graphs, and profile performance with TensorBoard - Google's ML
    visualization toolkit
  dependencies:
  - tensorboard
  - torch
  - tensorflow
- name: weights-and-biases
  path: skills/ai-research-skills/13-mlops/weights-and-biases/SKILL.md
  description: Track ML experiments with automatic logging, visualize training in
    real-time, optimize hyperparameters with sweeps, and manage model registry with
    W&B - collaborative MLOps platform
  dependencies:
  - wandb
- name: evolving-ai-agents
  path: skills/ai-research-skills/14-agents/a-evolve/SKILL.md
  description: Provides guidance for automatically evolving and optimizing AI agents
    across any domain using LLM-driven evolution algorithms. Use when building self-improving
    agents, optimizing agent prompts and skills against benchmarks, or implementing
    automated agent evaluation loops.
  dependencies:
  - a-evolve>=0.1.0
  - pyyaml>=6.0
- name: autogpt-agents
  path: skills/ai-research-skills/14-agents/autogpt/SKILL.md
  description: Autonomous AI agent platform for building and deploying continuous
    agents. Use when creating visual workflow agents, deploying persistent autonomous
    agents, or building complex multi-step AI automation systems.
  dependencies:
  - autogpt-platform>=0.4.0
- name: crewai-multi-agent
  path: skills/ai-research-skills/14-agents/crewai/SKILL.md
  description: Multi-agent orchestration framework for autonomous AI collaboration.
    Use when building teams of specialized agents working together on complex tasks,
    when you need role-based agent collaboration with memory, or for production workflows
    requiring sequential/hierarchical execution. Built without LangChain dependencies
    for lean, fast execution.
  dependencies:
  - crewai>=1.2.0
  - crewai-tools>=1.2.0
- name: langchain
  path: skills/ai-research-skills/14-agents/langchain/SKILL.md
  description: Framework for building LLM-powered applications with agents, chains,
    and RAG. Supports multiple providers (OpenAI, Anthropic, Google), 500+ integrations,
    ReAct agents, tool calling, memory management, and vector store retrieval. Use
    for building chatbots, question-answering systems, autonomous agents, or RAG applications.
    Best for rapid prototyping and production deployments.
  dependencies:
  - langchain
  - langchain-core
  - langchain-openai
  - langchain-anthropic
- name: llamaindex
  path: skills/ai-research-skills/14-agents/llamaindex/SKILL.md
  description: Data framework for building LLM applications with RAG. Specializes
    in document ingestion (300+ connectors), indexing, and querying. Features vector
    indices, query engines, agents, and multi-modal support. Use for document Q&A,
    chatbots, knowledge retrieval, or building RAG pipelines. Best for data-centric
    LLM applications.
  dependencies:
  - llama-index
  - openai
  - anthropic
- name: chroma
  path: skills/ai-research-skills/15-rag/chroma/SKILL.md
  description: Open-source embedding database for AI applications. Store embeddings
    and metadata, perform vector and full-text search, filter by metadata. Simple
    4-function API. Scales from notebooks to production clusters. Use for semantic
    search, RAG applications, or document retrieval. Best for local development and
    open-source projects.
  dependencies:
  - chromadb
  - sentence-transformers
- name: faiss
  path: skills/ai-research-skills/15-rag/faiss/SKILL.md
  description: Facebook's library for efficient similarity search and clustering of
    dense vectors. Supports billions of vectors, GPU acceleration, and various index
    types (Flat, IVF, HNSW). Use for fast k-NN search, large-scale vector retrieval,
    or when you need pure similarity search without metadata. Best for high-performance
    applications.
  dependencies:
  - faiss-cpu
  - faiss-gpu
  - numpy
- name: pinecone
  path: skills/ai-research-skills/15-rag/pinecone/SKILL.md
  description: Managed vector database for production AI applications. Fully managed,
    auto-scaling, with hybrid search (dense + sparse), metadata filtering, and namespaces.
    Low latency (<100ms p95). Use for production RAG, recommendation systems, or semantic
    search at scale. Best for serverless, managed infrastructure.
  dependencies:
  - pinecone-client
- name: qdrant-vector-search
  path: skills/ai-research-skills/15-rag/qdrant/SKILL.md
  description: High-performance vector similarity search engine for RAG and semantic
    search. Use when building production RAG systems requiring fast nearest neighbor
    search, hybrid search with filtering, or scalable vector storage with Rust-powered
    performance.
  dependencies:
  - qdrant-client>=1.12.0
- name: sentence-transformers
  path: skills/ai-research-skills/15-rag/sentence-transformers/SKILL.md
  description: Framework for state-of-the-art sentence, text, and image embeddings.
    Provides 5000+ pre-trained models for semantic similarity, clustering, and retrieval.
    Supports multilingual, domain-specific, and multimodal models. Use for generating
    embeddings for RAG, semantic search, or similarity tasks. Best for production
    embedding generation.
  dependencies:
  - sentence-transformers
  - transformers
  - torch
- name: dspy
  path: skills/ai-research-skills/16-prompt-engineering/dspy/SKILL.md
  description: Build complex AI systems with declarative programming, optimize prompts
    automatically, create modular RAG systems and agents with DSPy - Stanford NLP's
    framework for systematic LM programming
  dependencies:
  - dspy
  - openai
  - anthropic
- name: guidance
  path: skills/ai-research-skills/16-prompt-engineering/guidance/SKILL.md
  description: Control LLM output with regex and grammars, guarantee valid JSON/XML/code
    generation, enforce structured formats, and build multi-step workflows with Guidance
    - Microsoft Research's constrained generation framework
  dependencies:
  - guidance
  - transformers
- name: instructor
  path: skills/ai-research-skills/16-prompt-engineering/instructor/SKILL.md
  description: Extract structured data from LLM responses with Pydantic validation,
    retry failed extractions automatically, parse complex JSON with type safety, and
    stream partial results with Instructor - battle-tested structured output library
  dependencies:
  - instructor
  - pydantic
  - openai
  - anthropic
- name: outlines
  path: skills/ai-research-skills/16-prompt-engineering/outlines/SKILL.md
  description: Guarantee valid JSON/XML/code structure during generation, use Pydantic
    models for type-safe outputs, support local models (Transformers, vLLM), and maximize
    inference speed with Outlines - dottxt.ai's structured generation library
  dependencies:
  - outlines
  - transformers
  - vllm
  - pydantic
- name: langsmith-observability
  path: skills/ai-research-skills/17-observability/langsmith/SKILL.md
  description: LLM observability platform for tracing, evaluation, and monitoring.
    Use when debugging LLM applications, evaluating model outputs against datasets,
    monitoring production systems, or building systematic testing pipelines for AI
    applications.
  dependencies:
  - langsmith>=0.2.0
- name: phoenix-observability
  path: skills/ai-research-skills/17-observability/phoenix/SKILL.md
  description: Open-source AI observability platform for LLM tracing, evaluation,
    and monitoring. Use when debugging LLM applications with detailed traces, running
    evaluations on datasets, or monitoring production AI systems with real-time insights.
  dependencies:
  - arize-phoenix>=12.0.0
- name: audiocraft-audio-generation
  path: skills/ai-research-skills/18-multimodal/audiocraft/SKILL.md
  description: PyTorch library for audio generation including text-to-music (MusicGen)
    and text-to-sound (AudioGen). Use when you need to generate music from text descriptions,
    create sound effects, or perform melody-conditioned music generation.
  dependencies:
  - audiocraft
  - torch>=2.0.0
  - transformers>=4.30.0
- name: blip-2-vision-language
  path: skills/ai-research-skills/18-multimodal/blip-2/SKILL.md
  description: Vision-language pre-training framework bridging frozen image encoders
    and LLMs. Use when you need image captioning, visual question answering, image-text
    retrieval, or multimodal chat with state-of-the-art zero-shot performance.
  dependencies:
  - transformers>=4.30.0
  - torch>=1.10.0
  - Pillow
- name: clip
  path: skills/ai-research-skills/18-multimodal/clip/SKILL.md
  description: OpenAI's model connecting vision and language. Enables zero-shot image
    classification, image-text matching, and cross-modal retrieval. Trained on 400M
    image-text pairs. Use for image search, content moderation, or vision-language
    tasks without fine-tuning. Best for general-purpose image understanding.
  dependencies:
  - transformers
  - torch
  - pillow
- name: evaluating-cosmos-policy
  path: skills/ai-research-skills/18-multimodal/cosmos-policy/SKILL.md
  description: Evaluates NVIDIA Cosmos Policy on LIBERO and RoboCasa simulation environments.
    Use when setting up cosmos-policy for robot manipulation evaluation, running headless
    GPU evaluations with EGL rendering, or profiling inference latency on cluster
    or local GPU machines.
  dependencies:
  - torch>=2.1.0
  - mujoco>=3.0.0
  - robosuite>=1.4.0
  - robocasa @ git+https://github.com/moojink/robocasa-cosmos-policy.git
  - transformers>=4.40.0
  - cosmos-policy @ git+https://github.com/NVlabs/cosmos-policy.git
- name: llava
  path: skills/ai-research-skills/18-multimodal/llava/SKILL.md
  description: Large Language and Vision Assistant. Enables visual instruction tuning
    and image-based conversations. Combines CLIP vision encoder with Vicuna/LLaMA
    language models. Supports multi-turn image chat, visual question answering, and
    instruction following. Use for vision-language chatbots or image understanding
    tasks. Best for conversational image analysis.
  dependencies:
  - transformers
  - torch
  - pillow
- name: fine-tuning-serving-openpi
  path: skills/ai-research-skills/18-multimodal/openpi/SKILL.md
  description: Fine-tune and serve Physical Intelligence OpenPI models (pi0, pi0-fast,
    pi0.5) using JAX or PyTorch backends for robot policy inference across ALOHA,
    DROID, and LIBERO environments. Use when adapting pi0 models to custom datasets,
    converting JAX checkpoints to PyTorch, running policy inference servers, or debugging
    norm stats and GPU memory issues.
  dependencies:
  - uv>=0.4.0
  - jax>=0.4.30
  - torch>=2.1.0
  - transformers>=4.53.2
- name: fine-tuning-openvla-oft
  path: skills/ai-research-skills/18-multimodal/openvla-oft/SKILL.md
  description: Fine-tunes and evaluates OpenVLA-OFT and OpenVLA-OFT+ policies for
    robot action generation with continuous action heads, LoRA adaptation, and FiLM
    conditioning on LIBERO simulation and ALOHA real-world setups. Use when reproducing
    OpenVLA-OFT paper results, training custom VLA action heads (L1 or diffusion),
    deploying server-client inference for ALOHA, or debugging normalization, LoRA
    merge, and cross-GPU issues.
  dependencies:
  - torch==2.2.0
  - transformers>=4.40.0
  - peft==0.11.1
  - draccus==0.8.0
  - accelerate>=0.25.0
  - wandb>=0.16.0
  - fastapi>=0.100.0
  - uvicorn>=0.24.0
  - tensorflow==2.15.0
  - robosuite==1.4.0
- name: segment-anything-model
  path: skills/ai-research-skills/18-multimodal/segment-anything/SKILL.md
  description: Foundation model for image segmentation with zero-shot transfer. Use
    when you need to segment any object in images using points, boxes, or masks as
    prompts, or automatically generate all object masks in an image.
  dependencies:
  - segment-anything
  - transformers>=4.30.0
  - torch>=1.7.0
- name: stable-diffusion-image-generation
  path: skills/ai-research-skills/18-multimodal/stable-diffusion/SKILL.md
  description: State-of-the-art text-to-image generation with Stable Diffusion models
    via HuggingFace Diffusers. Use when generating images from text prompts, performing
    image-to-image translation, inpainting, or building custom diffusion pipelines.
  dependencies:
  - diffusers>=0.30.0
  - transformers>=4.41.0
  - accelerate>=0.31.0
  - torch>=2.0.0
- name: whisper
  path: skills/ai-research-skills/18-multimodal/whisper/SKILL.md
  description: OpenAI's general-purpose speech recognition model. Supports 99 languages,
    transcription, translation to English, and language identification. Six model
    sizes from tiny (39M params) to large (1550M params). Use for speech-to-text,
    podcast transcription, or multilingual audio processing. Best for robust, multilingual
    ASR.
  dependencies:
  - openai-whisper
  - transformers
  - torch
- name: knowledge-distillation
  path: skills/ai-research-skills/19-emerging-techniques/knowledge-distillation/SKILL.md
  description: Compress large language models using knowledge distillation from teacher
    to student models. Use when deploying smaller models with retained performance,
    transferring GPT-4 capabilities to open-source models, or reducing inference costs.
    Covers temperature scaling, soft targets, reverse KLD, logit distillation, and
    MiniLLM training strategies.
  dependencies:
  - transformers
  - torch
  - datasets
- name: long-context
  path: skills/ai-research-skills/19-emerging-techniques/long-context/SKILL.md
  description: Extend context windows of transformer models using RoPE, YaRN, ALiBi,
    and position interpolation techniques. Use when processing long documents (32k-128k+
    tokens), extending pre-trained models beyond original context limits, or implementing
    efficient positional encodings. Covers rotary embeddings, attention biases, interpolation
    methods, and extrapolation strategies for LLMs.
  dependencies:
  - transformers
  - torch
  - flash-attn
- name: model-merging
  path: skills/ai-research-skills/19-emerging-techniques/model-merging/SKILL.md
  description: Merge multiple fine-tuned models using mergekit to combine capabilities
    without retraining. Use when creating specialized models by blending domain-specific
    expertise (math + coding + chat), improving performance beyond single models,
    or experimenting rapidly with model variants. Covers SLERP, TIES-Merging, DARE,
    Task Arithmetic, linear merging, and production deployment strategies.
  dependencies:
  - mergekit
  - transformers
  - torch
- name: model-pruning
  path: skills/ai-research-skills/19-emerging-techniques/model-pruning/SKILL.md
  description: Reduce LLM size and accelerate inference using pruning techniques like
    Wanda and SparseGPT. Use when compressing models without retraining, achieving
    50% sparsity with minimal accuracy loss, or enabling faster inference on hardware
    accelerators. Covers unstructured pruning, structured pruning, N:M sparsity, magnitude
    pruning, and one-shot methods.
  dependencies:
  - transformers
  - torch
- name: moe-training
  path: skills/ai-research-skills/19-emerging-techniques/moe-training/SKILL.md
  description: Train Mixture of Experts (MoE) models using DeepSpeed or HuggingFace.
    Use when training large-scale models with limited compute (5× cost reduction vs
    dense models), implementing sparse architectures like Mixtral 8x7B or DeepSeek-V3,
    or scaling model capacity without proportional compute increase. Covers MoE architectures,
    routing mechanisms, load balancing, expert parallelism, and inference optimization.
  dependencies:
  - deepspeed
  - transformers
  - torch
  - accelerate
- name: speculative-decoding
  path: skills/ai-research-skills/19-emerging-techniques/speculative-decoding/SKILL.md
  description: Accelerate LLM inference using speculative decoding, Medusa multiple
    heads, and lookahead decoding techniques. Use when optimizing inference speed
    (1.5-3.6× speedup), reducing latency for real-time applications, or deploying
    models with limited compute. Covers draft models, tree-based attention, Jacobi
    iteration, parallel token generation, and production deployment strategies.
  dependencies:
  - transformers
  - torch
- name: academic-plotting
  path: skills/ai-research-skills/20-ml-paper-writing/academic-plotting/SKILL.md
  description: Generates publication-quality figures for ML papers from research context.
    Given a paper section or description, extracts system components and relationships
    to generate architecture diagrams via Gemini. Given experiment results or data,
    auto-selects chart type and generates data-driven figures via matplotlib/seaborn.
    Use when creating any figure for a conference paper.
  dependencies:
  - matplotlib>=3.8.0
  - seaborn>=0.13.0
  - numpy
  - google-genai>=1.0.0
- name: ml-paper-writing
  path: skills/ai-research-skills/20-ml-paper-writing/ml-paper-writing/SKILL.md
  description: Write publication-ready ML/AI papers for NeurIPS, ICML, ICLR, ACL,
    AAAI, COLM. Use when drafting papers from research repos, structuring arguments,
    verifying citations, or preparing camera-ready submissions. For systems venues
    (OSDI, NSDI, ASPLOS, SOSP), use systems-paper-writing instead.
  dependencies:
  - semanticscholar
  - arxiv
  - habanero
  - requests
- name: presenting-conference-talks
  path: skills/ai-research-skills/20-ml-paper-writing/presenting-conference-talks/SKILL.md
  description: Generates conference presentation slides (Beamer LaTeX PDF and editable
    PPTX) from a compiled paper with speaker notes and talk script. Use when preparing
    oral talks, spotlight presentations, or invited talks for ML and systems conferences.
  dependencies:
  - python-pptx>=0.6.21
- name: systems-paper-writing
  path: skills/ai-research-skills/20-ml-paper-writing/systems-paper-writing/SKILL.md
  description: Comprehensive guide for writing systems papers targeting OSDI, SOSP,
    ASPLOS, NSDI, and EuroSys. Provides paragraph-level structural blueprints, writing
    patterns, venue-specific checklists, reviewer guidelines, LaTeX templates, and
    conference deadlines. Use this skill for all systems conference paper writing.
- name: brainstorming-research-ideas
  path: skills/ai-research-skills/21-research-ideation/brainstorming-research-ideas/SKILL.md
  description: Guides researchers through structured ideation frameworks to discover
    high-impact research directions. Use when exploring new problem spaces, pivoting
    between projects, or seeking novel angles on existing work.
- name: creative-thinking-for-research
  path: skills/ai-research-skills/21-research-ideation/creative-thinking-for-research/SKILL.md
  description: Applies cognitive science frameworks for creative thinking to CS and
    AI research ideation. Use when seeking genuinely novel research directions by
    leveraging combinatorial creativity, analogical reasoning, constraint manipulation,
    and other empirically grounded creative strategies.
- name: ara-compiler
  path: skills/ai-research-skills/22-agent-native-research-artifact/compiler/SKILL.md
  description: Compiles any research input — PDF papers, GitHub repositories, experiment
    logs, code directories, or raw notes — into a complete Agent-Native Research Artifact
    (ARA) with cognitive layer (claims, concepts, heuristics), physical layer (configs,
    code stubs), exploration graph, and grounded evidence. Use when ingesting a paper
    or codebase into a structured, machine-executable knowledge package, building
    an ARA from scratch, or converting research outputs into a falsifiable, agent-traversable
    form.
- name: ara-research-manager
  path: skills/ai-research-skills/22-agent-native-research-artifact/research-manager/SKILL.md
  description: Records research provenance as a post-task epilogue, scanning conversation
    history at the end of a coding or research session to extract decisions, experiments,
    dead ends, claims, heuristics, and pivots, and writing them into the ara/ directory
    with user-vs-AI provenance tags. Use as a session epilogue — never during execution
    — to maintain a faithful, auditable trace of how a research project actually evolved.
- name: ara-rigor-reviewer
  path: skills/ai-research-skills/22-agent-native-research-artifact/rigor-reviewer/SKILL.md
  description: Performs ARA Seal Level 2 semantic epistemic review on Agent-Native
    Research Artifacts, scoring six dimensions (evidence relevance, falsifiability,
    scope calibration, argument coherence, exploration integrity, methodological rigor)
    and producing a constructive, severity-ranked report with a Strong Accept-to-Reject
    recommendation. Use after Level 1 structural validation passes, when an ARA needs
    an objective epistemic critique before publication or release.
rules:
- name: ai-research-skills-claude-instructions
  path: CLAUDE.md
