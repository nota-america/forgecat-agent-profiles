- name: add-shader-cursor-trail
  path: skills/add-shader-cursor-trail/SKILL.md
  description: 'Add the Shaders WebGPU mouse effect used for the Tidal Commons hero: a white twinkling
    halftone cursor trail driven by ChromaFlow, masked through a DotGrid, finished with chromatic ripples
    and film grain, and protected by static, touch, accessibility, SSR, and performance fallbacks. Use
    when a user asks for this shader mouse effect, a halftone cursor trail, an interactive WebGPU hero/contact
    background, or a reusable cursor-following shader layer in React, Next.js, Vue, Svelte, Solid, or
    plain web projects.'
