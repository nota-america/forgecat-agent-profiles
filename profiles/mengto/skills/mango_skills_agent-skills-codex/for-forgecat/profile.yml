name: '@forgecat/mango_skills_agent-skills-codex'
description: Codex-oriented agent skills for auditing, browser capture, inspiration workflows, media conversion,
  profiling, publishing, and skill authoring.
visibility: public
repository: https://github.com/MengTo/Skills/tree/main/agent-skills/codex
license: MIT
sourcePlatform: codex
compatibility:
  platforms:
    tested: []
    partial:
    - claude-code
    - cursor
    - codex
    - openclaw
    - hermes
  models:
    recommended: []
    minimum: []
skills:
- name: article-prompts-to-skills
  path: skills/article-prompts-to-skills/SKILL.md
  description: Convert an article, tutorial, or prompt pack into focused reusable AgentSkills, one independent
    capability per skill, with portable instructions, example prompts, working demos, preview screenshots,
    validation, gallery updates, and a narrow commit. Use when the user asks to turn an article's prompts,
    tutorial sections, design patterns, interactions, or workflow ideas into complete skills rather than
    leaving them as prose.
- name: audit-reference-originality
  path: skills/audit-reference-originality/SKILL.md
  description: Audit a website or digital experience against its supplied source references for originality
    and plagiarism risk. Use when Codex must compare current or historical site output with reference
    pages, capture packs, screenshots, copy, brands, numbers, images, assets, videos, layouts, motion,
    or code; raise evidence-backed red flags; distinguish common visual grammar from distinctive copying;
    and propose concrete fixes without making unsupported legal claims.
  scripts:
  - path: skills/audit-reference-originality/scripts/build_evidence_inventory.py
    runtime: python
    description: Build deterministic originality-audit leads from a site and references.
- name: audit-verify-explain-grade-5
  path: skills/audit-verify-explain-grade-5/SKILL.md
  description: Audit work, verify claims with concrete evidence, and explain the result in simple grade-5
    language. Use when the user asks to review, audit, check, verify, explain a change, explain a fix,
    summarize test results, validate whether something works, or translate technical findings into plain
    language for non-technical readers.
- name: browser-video-recording
  path: skills/browser-video-recording/SKILL.md
  description: Create polished 60 fps 4:3 4K browser screen-recording style videos from Codex in-app browser
    captures, with browser-only crop, natural macOS cursor styling, deliberate click choreography, zoom-follow
    framing, ffprobe/thumbnail verification, and optional native recording compatibility checks. Use when
    the user asks to record or re-record browser actions, show cursor clicks and zooms, make Dribbble/UI
    inspiration or product demo recordings, or asks whether Codex, Playwright, or an MCP can produce a
    natural browser demo video.
  scripts:
  - path: skills/browser-video-recording/scripts/render_browser_demo.py
    runtime: python
    description: Render a browser screenshot sequence with a macOS-style cursor and zoom.
- name: build-daily-inspiration-sites
  path: skills/build-daily-inspiration-sites/SKILL.md
  description: Turn a completed daily UI inspiration capture into exactly five original landing-page builds,
    one per separate Codex task, using Sites. Use when the user asks to turn the daily inspiration references,
    a five-item UI prompt pack, or a dated `*-ui-inspiration-capture` article into distinct HTML landing
    pages while changing the source brands, names, copy, people, numbers, pricing, claims, and imagery.
- name: daily-ui-inspiration-capture
  path: skills/daily-ui-inspiration-capture/SKILL.md
  description: Create a recurring daily UI inspiration capture. Use when the user asks to run, refresh,
    package, or validate dated UI inspiration bundles, especially for `articles/YYYY-MM-DD-ui-inspiration-capture/`
    outputs, Framer/Dribbble landing-page inspiration, motion-study screenshots/videos, AI-builder prompts,
    duplicate checking, or converting a project runbook into repeatable workflow.
- name: elevenlabs-tts
  path: skills/elevenlabs-tts/SKILL.md
  description: Generate ElevenLabs text-to-speech audio from scripts or inline text using local voice
    profiles. Use when the user asks for ElevenLabs, text-to-speech, TTS, narration, voiceover, speech
    audio, or voice generation; load voice names, voice ids, emails, owners, and account-specific defaults
    only from local config outside the skill.
  scripts:
  - path: skills/elevenlabs-tts/scripts/generate_voice.py
    runtime: python
    description: Generate ElevenLabs speech from local voice profiles.
- name: generate-reference-inspired-brand-worlds
  path: skills/generate-reference-inspired-brand-worlds/SKILL.md
  description: Generate multiple original brand campaign worlds from a supplied visual reference while
    controlling how close the new work feels without copying protected signature elements. Use when a
    user provides a brand identity image, poster, editorial campaign, moodboard, or generated concept
    and asks for inspired alternatives, several distinct brands in one visual family, a closer-to-reference
    V2, exact wordmarks inside images, or originality-safe image-generation prompts and outputs.
- name: html-to-interaction-prompts
  path: skills/html-to-interaction-prompts/SKILL.md
  description: Convert a supplied HTML page or generated HTML reference into a screenshot-backed article
    containing multiple reusable interaction prompts. Use when the user provides an HTML file, exported
    page, generated-page.html, or local/live reference and asks to extract animation/interactions, create
    prompts, capture screenshots for each prompt, add them to an article, or commit the resulting article/assets.
- name: implement-fog-of-war
  path: skills/implement-fog-of-war/SKILL.md
  description: Implement, tune, debug, or validate soft wall-aware fog of war and gameplay perception
    in Three.js action games. Use for orthographic or isometric visibility masks, obstacle-aware line
    of sight, player and enemy vision ranges, hidden-enemy targeting rules, fog shader artifacts such
    as spokes or seams, mobile ray budgets, lifecycle and menu-state integration, and deterministic fog-of-war
    tests.
- name: iterate-until-verified
  path: skills/iterate-until-verified/SKILL.md
  description: Apply a prompt-agnostic execution and verification loop to any substantial task while preserving
    the original request. Use when the user asks to fan out work, use subagents or independent reviewers,
    loop until done, benchmark against references, apply a harsh critic, compare candidates blind, improve
    an existing prompt with verification, or continue until explicit quality gates pass.
- name: optimize-web-animations
  path: skills/optimize-web-animations/SKILL.md
  description: Profile, audit, and optimize frontend page performance with emphasis on animation work,
    memory-leak risks, long-session slowdowns, CSS animations, canvas/WebGL requestAnimationFrame loops,
    marquees, skeletons, GSAP/Three/Matter effects, timers, listeners, and observers. Use when the user
    asks to make animations performant, pause offscreen animations, look for memory leaks, profile pages
    that slow the computer over time, fix janky scrolling, reduce CPU/GPU use, or repeat the "only play
    in view" optimization on React/Vite/Next/frontend pages using Codex Browser.
- name: performance-profiling
  path: skills/performance-profiling/SKILL.md
  description: Guide performance profiling for Apple platform apps with Instruments, Xcode diagnostics,
    and MetricKit. Use when investigating app hangs, stutters, high CPU, memory leaks, memory growth,
    OOM crashes, slow launch, battery drain, thermal issues, App Store performance readiness, or when
    adding os_signpost and measurement hooks.
- name: publish-project-to-github
  path: skills/publish-project-to-github/SKILL.md
  description: Package a finished local project into an intentional GitHub repository, create a strong
    README and visual preview, push it safely, configure a public GitHub Pages URL when the project is
    compatible, and verify the deployed result. Use when a user asks to upload, publish, open-source,
    share, or turn a local HTML/CSS/JavaScript experiment or small web project into a documented GitHub
    repository with a live demo.
  scripts:
  - path: skills/publish-project-to-github/scripts/audit_public_project.sh
    runtime: bash
    description: Audit public project.
- name: stitched-full-page-capture
  path: skills/stitched-full-page-capture/SKILL.md
  description: Capture or repair reliable full-page screenshots for lazy-loaded, scroll-animated, Framer,
    WebGL/canvas, or reveal-heavy web pages. Use when full-page screenshots are blank, gray, white, sparse,
    show a tiny content strip, disagree with a working scroll video, or when article evidence/section
    crops must be derived from a trustworthy full-page image.
- name: video-to-superprompt
  path: skills/video-to-superprompt/SKILL.md
  description: Turn a reference video into a super detailed recreation or inspiration prompt. Use when
    the user provides, mentions, uploads, links, or points to a video and asks to analyze the design,
    UI, animations, transitions, scroll interactions, typography, colors, assets, WebGL/Three.js, storytelling,
    section-by-section behavior, or to create a prompt/article that recreates the page, app, interaction,
    or motion system.
- name: web-technique-to-skill
  path: skills/web-technique-to-skill/SKILL.md
  description: Turn a visual or interaction technique you already built into a reusable web-design skill,
    by isolating the one mechanism that makes it work while reproducing its approved reference exactly
    around that focus, and packaging it with a demo that proves both the mechanism and the visual fidelity.
    Covers finding the mechanism, naming the technique plainly, disclosing the verified runtime and renderer,
    auditing reference layers, carrying real numbers instead of adjectives, preserving owned staging,
    keeping expensive gotchas, declaring the boundary against neighbouring skills, and browser-verifying
    before claiming it works. Use when a page, canvas scene, shader, scroll effect, layout system, or
    hover interaction turned out well and should become a skill rather than staying in one project.
- name: write-like-meng-on-x
  path: skills/write-like-meng-on-x/SKILL.md
  description: Write, rewrite, review, or continuously refine X/Twitter posts in Meng To's current voice
    using his deduplicated authored-post corpus, personal and product context, shared resources, and Content
    repo evidence. Use when asked to improve a tweet in Meng's tone, draft an original post, reply, thread,
    resource share, or quote post as Meng, check whether an angle repeats an earlier post, study Meng's
    writing style, ingest another 20-50 authored posts, or hone the reusable Meng X voice profile.
- name: x-bookmark-quote-posts
  path: skills/x-bookmark-quote-posts/SKILL.md
  description: Check a user's latest X/Twitter bookmarks and turn recent saved posts into source-backed
    quote-post drafts calibrated against the user's latest 100 authored posts. Use when asked to review
    X bookmarks, create quote posts from bookmarks, refresh a bookmark quote queue, run a bookmark quote
    automation, study a user's X voice, or write first-person quote posts from X sources.
