name: "@forgecat/mango_skills_agent-skills-ui"
description: >-
  UI and frontend design skills for taste enforcement, visual systems, SwiftUI, SEO,
  image-to-code, and design-first prompting.
repository: https://github.com/MengTo/Skills/tree/main/agent-skills/ui
license: MIT
visibility: public
sourcePlatform: agent-skills
compatibility:
  platforms:
    tested: []
    partial:
    - claude-code
    - cursor
    - codex
  models:
    recommended: []
    minimum: []
skills:
- name: design-first-ui-prompting
  path: skills/design-first-ui-prompting/SKILL.md
  description: >-
    Use when you need design-first, spec-driven, skimmable prompts for UI generation. Covers
    prompt structure, constraints, variations, typography/spacing rules, and iteration workflow
    for consistent UI outputs.
- name: design-taste-frontend
  path: skills/design-taste-frontend/SKILL.md
  description: >-
    Senior UI/UX Engineer. Architect digital interfaces overriding default LLM biases. Enforces
    metric-based rules, strict component architecture, CSS hardware acceleration, and balanced
    design engineering.
- name: frontend-design
  path: skills/frontend-design/SKILL.md
  description: >-
    Create distinctive, production-grade frontend interfaces with high design quality. Use this
    skill when the user asks to build web components, pages, artifacts, posters, or applications
    (examples include websites, landing pages, dashboards, React components, HTML/CSS layouts, or
    when styling/beautifying any web UI). Generates creative, polished code and UI design that
    avoids generic AI aesthetics.
- name: full-output-enforcement
  path: skills/full-output-enforcement/SKILL.md
  description: >-
    Overrides default LLM truncation behavior. Enforces complete code generation, bans placeholder
    patterns, and handles token-limit splits cleanly. Apply to any task requiring exhaustive,
    unabridged output.
- name: gpt-taste
  path: skills/gpt-taste/SKILL.md
  description: >-
    Elite UX/UI & Advanced GSAP Motion Engineer. Enforces Python-driven true randomization for
    layout variance, strict AIDA page structure, wide editorial typography (bans 6-line wraps),
    gapless bento grids, strict GSAP ScrollTriggers (pinning, stacking, scrubbing), inline
    micro-images, and massive section spacing.
- name: high-end-visual-design
  path: skills/high-end-visual-design/SKILL.md
  description: >-
    Teaches the AI to design like a high-end agency. Defines the exact fonts, spacing, shadows,
    card structures, and animations that make a website feel expensive. Blocks all the common
    defaults that make AI designs look cheap or generic.
- name: image-to-code
  path: skills/image-to-code/SKILL.md
  description: >-
    Elite website image-to-code skill for Codex. For visually important web tasks, it must first
    generate the design image(s) itself, deeply analyze them, then implement the website to match
    them as closely as possible. In Codex, it must prefer large, readable, section-specific images
    instead of tiny compressed boards, generate fresh standalone images for sections or detail
    views instead of cropping old ones, avoid lazy under-generation, avoid
    cards-inside-cards-inside-cards UI, and keep the hero clean, spacious, readable, and visible
    on a small laptop.
- name: industrial-brutalist-ui
  path: skills/industrial-brutalist-ui/SKILL.md
  description: >-
    Raw mechanical interfaces fusing Swiss typographic print with military terminal aesthetics.
    Rigid grids, extreme type scale contrast, utilitarian color, analog degradation effects. For
    data-heavy dashboards, portfolios, or editorial sites that need to feel like declassified
    blueprints.
- name: minimalist-ui
  path: skills/minimalist-ui/SKILL.md
  description: >-
    Clean editorial-style interfaces. Warm monochrome palette, typographic contrast, flat bento
    grids, muted pastels. No gradients, no heavy shadows.
- name: redesign-existing-projects
  path: skills/redesign-existing-projects/SKILL.md
  description: >-
    Upgrades existing websites and apps to premium quality. Audits current design, identifies
    generic AI patterns, and applies high-end design standards without breaking functionality.
    Works with any CSS framework or vanilla CSS.
- name: seo-audit
  path: skills/seo-audit/SKILL.md
  description: >-
    When the user wants to audit, review, or diagnose SEO issues on their site. Also use when the
    user mentions "SEO audit," "technical SEO," "why am I not ranking," "SEO issues," "on-page
    SEO," "meta tags review," "SEO health check," "my traffic dropped," "lost rankings," "not
    showing up in Google," "site isn't ranking," "Google update hit me," "page speed," "core web
    vitals," "crawl errors," or "indexing issues." Use this even if the user just says something
    vague like "my SEO is bad" or "help with SEO" — start with an audit. For building pages at
    scale to target keywords, see programmatic-seo. For adding structured data, see schema-markup.
    For AI search optimization, see ai-seo.
- name: stitch-design-taste
  path: skills/stitch-design-taste/SKILL.md
  description: >-
    Semantic Design System Skill for Google Stitch. Generates agent-friendly DESIGN.md files that
    enforce premium, anti-generic UI standards — strict typography, calibrated color, asymmetric
    layouts, perpetual micro-motion, and hardware-accelerated performance.
- name: swiftui-pro
  path: skills/swiftui-pro/SKILL.md
  description: >-
    Comprehensively reviews SwiftUI code for best practices on modern APIs, maintainability, and
    performance. Use when reading, writing, or reviewing SwiftUI projects.
