name: '@forgecat/mango_skills_agent-skills-game-development'
description: Game development skills for browser-game architecture, combat, enemies, assets, performance,
  testing, and release workflows.
visibility: public
repository: https://github.com/MengTo/Skills/tree/main/agent-skills/game-development
license: MIT
sourcePlatform: agent-skills
compatibility:
  platforms:
    tested:
    - claude-code
    - cursor
    - codex
    - openclaw
    - hermes
    partial: []
  models:
    recommended: []
    minimum: []
skills:
- name: author-game-levels
  path: skills/author-game-levels/SKILL.md
  description: Author or revise readable, flat-world Three.js game levels. Use for movement and camera
    routes, collision and navigation, encounter zones, landmarks, objectives, pickups, motivated lighting,
    visibility, deterministic level data, or desktop and mobile playthrough verification.
- name: build-game-audio-feedback
  path: skills/build-game-audio-feedback/SKILL.md
  description: Design or implement responsive audio feedback for a Three.js or web game. Use for action
    sounds, combat layers, music states, spatial audio, mix priorities, mute controls, accessibility,
    mobile audio unlock, and audio performance.
- name: build-game-camera-controls
  path: skills/build-game-camera-controls/SKILL.md
  description: Implement or tune Three.js game cameras. Use for isometric framing, follow behavior, orbit/zoom
    limits, occlusion, lock-on, camera shake, touch camera controls, and camera regression tests.
- name: build-game-changelog
  path: skills/build-game-changelog/SKILL.md
  description: Design, implement, backfill, audit, and release in-game changelogs with contiguous versioning,
    deployment provenance, menu-state navigation, accessible toggle, close, and Escape behavior, and responsive
    release-ledger UI. Use when Codex needs to add or revise a changelog or version screen in a game,
    reconstruct release history from deployments and Git, define version-bump rules, keep displayed versions
    synchronized with live builds, or test changelog mechanics across desktop and mobile.
- name: build-game-inventory
  path: skills/build-game-inventory/SKILL.md
  description: Build or repair game inventory, loot, equipment, tooltips, drag-and-drop, persistence,
    and progression systems. Use for item schemas, pickup flows, stack rules, equipment slots, atomic
    swaps, save migration, and no-loss regression testing.
- name: build-game-map-editor
  path: skills/build-game-map-editor/SKILL.md
  description: Build, extend, or audit production-linked browser map editors for Three.js and isometric
    games. Use when Codex needs to create a private director view, derive a versioned editor document
    from authored placements, add outliner, layer, selection, drag, snap, inspector, or camera controls,
    expose enemy aggro, leash, or patrol overlays, implement local draft import, export, undo, and reset,
    secure an editor route with IP and password sessions, or validate and release a map editor without
    mutating live gameplay data.
- name: build-game-monster-system
  path: skills/build-game-monster-system/SKILL.md
  description: Build, integrate, audit, or refactor rigged monsters for Three.js and web action games.
    Use for monster asset contracts, procedural or imported creature rigs, semantic joints and sockets,
    hurtboxes and attack volumes, combat animation states, enemy-runtime adapters, LODs, deterministic
    review fixtures, and validating that every monster follows one shared system.
- name: build-hybrid-game-assets
  path: skills/build-hybrid-game-assets/SKILL.md
  description: Plan, create, integrate, or audit a hybrid asset pipeline for a Three.js or web game. Use
    when choosing among imported meshes, procedural 3D geometry, AI-generated reference art, 2D UI media,
    sprites, VFX, and performance-ready runtime asset delivery.
- name: build-isometric-arpg
  path: skills/build-isometric-arpg/SKILL.md
  description: Build or extend a playable isometric action RPG in Three.js, React, or similar web technology.
    Use for game-loop architecture, camera and movement, zones, combat integration, content data, progression,
    saves, or production-ready vertical slices.
- name: build-mobile-threejs-games
  path: skills/build-mobile-threejs-games/SKILL.md
  description: Build, tune, or test a Three.js game for mobile web. Use for touch movement, action controls,
    target selection, touch inventory, safe areas, portrait/landscape layouts, responsive HUD, battery/performance
    budgets, and real mobile browser QA.
- name: build-rigged-game-assets
  path: skills/build-rigged-game-assets/SKILL.md
  description: Create, integrate, or audit production-ready rigged 3D characters and monsters with a main
    model, skeleton, animation library, sockets, collision contracts, separate character equipment, optimized
    runtime files, catalog media, and an interactive moveset inspector. Use when generating or importing
    FBX/GLB game actors; defining character-versus-monster asset requirements; separating swords, shields,
    helmets, armor, or stowed gear; adding idle, walk, run, attack, hit, dodge, block, cast, or death
    clips; wiring an asset into gameplay; or adding action and equipment controls plus deterministic tests
    to a game asset catalog.
  scripts:
  - path: skills/build-rigged-game-assets/scripts/validate_asset_manifest.py
    runtime: python
    description: Validate a rigged character or monster asset manifest.
- name: build-threejs-enemy-systems
  path: skills/build-threejs-enemy-systems/SKILL.md
  description: Build or refactor reusable, data-driven enemy archetype and moveset systems for Three.js
    action games. Use for enemy content schemas, model and rig conventions, combat move timing and contact
    contracts, runtime state boundaries, placeholder fallbacks, deterministic fixtures, or production
    playthrough validation.
- name: build-vesperfall-review-assets
  path: skills/build-vesperfall-review-assets/SKILL.md
  description: Build truthful Vesperfall asset-library review pairs from transparent PNG references and
    live Three.js, FBX, or img2threejs models. Use when adding a character, enemy, prop, or equipment
    asset to the Vesperfall catalog; creating a card-PNG plus inspector-model treatment; exposing an isolated
    model or moveset route; or standardizing provenance, grounding, tests, and Codex-browser validation
    for game art review.
  scripts:
  - path: skills/build-vesperfall-review-assets/scripts/validate_pair.py
    runtime: python
    description: Validate a Vesperfall catalog PNG and its declared local model source.
- name: create-game-vfx
  path: skills/create-game-vfx/SKILL.md
  description: Create readable, performance-safe Three.js game visual effects. Use for attacks, impacts,
    damage feedback, status effects, spell trails, particles, shaders, telegraphs, quality tiers, and
    reduced-motion alternatives.
- name: design-action-combat
  path: skills/design-action-combat/SKILL.md
  description: Design, implement, tune, or test readable tactical action combat for web games. Use for
    attack timing, guard and dodge windows, hit contact, posture, lock-on, weapons, boss phases, combat
    feedback, and deterministic combat tests.
- name: design-game-encounters
  path: skills/design-game-encounters/SKILL.md
  description: Design, implement, tune, or test Three.js action-game encounters. Use for arena layout,
    enemy composition, spawn pacing, objectives, boss phases, reward cadence, encounter fixtures, and
    difficulty validation.
- name: optimize-threejs-games
  path: skills/optimize-threejs-games/SKILL.md
  description: Profile, diagnose, and improve Three.js or WebGL game performance without regressing gameplay.
    Use for frame-time drops, CPU/GPU pressure, draw calls, texture and geometry budgets, animation loops,
    adaptive quality, mobile performance, and browser performance verification.
- name: ship-web-games
  path: skills/ship-web-games/SKILL.md
  description: Package, deploy, and verify a playable Three.js or web game. Use for release builds, asset
    delivery, private/public deployment, production smoke tests, browser proof, release notes, rollback
    readiness, and cleanup of temporary QA resources.
- name: test-playable-web-games
  path: skills/test-playable-web-games/SKILL.md
  description: Test a playable browser game end to end with deterministic fixtures and real browser evidence.
    Use for gameplay QA, regression testing, controls, accessibility, responsive/mobile testing, save
    flows, console checks, performance smoke tests, and release verification.
- name: tune-enemy-ai
  path: skills/tune-enemy-ai/SKILL.md
  description: Build, debug, balance, or test combat enemy AI for playable action games. Use for aggro,
    target selection, navigation, spacing, attack choices, telegraphs, retreats, boss behavior, behavior-state
    machines, and deterministic AI regression tests.
