name: '@forgecat/addyosmani_agent-skills'
description: Production-grade engineering skills for AI coding agents covering the full software development
  lifecycle from spec to ship.
repository: https://github.com/addyosmani/agent-skills
license: MIT
visibility: public
sourcePlatform: multi-host
platforms:
  cursor:
    mode: override
  codex:
    mode: override
compatibility:
  platforms:
    tested:
    - claude-code
    partial:
    - cursor
    - codex
    - openclaw
    - hermes
  models:
    recommended: []
    minimum: []
agents:
- name: code-reviewer
  path: agents/code-reviewer.md
  description: Senior code reviewer that evaluates changes across five dimensions — correctness, readability,
    architecture, security, and performance. Use for thorough code review before merge.
- name: security-auditor
  path: agents/security-auditor.md
  description: Security engineer focused on vulnerability detection, threat modeling, and secure coding
    practices. Use for security-focused code review, threat analysis, or hardening recommendations.
- name: test-engineer
  path: agents/test-engineer.md
  description: QA engineer specialized in test strategy, test writing, and coverage analysis. Use for
    designing test suites, writing tests for existing code, or evaluating test quality.
- name: web-performance-auditor
  path: agents/web-performance-auditor.md
  description: Web performance engineer focused on Core Web Vitals, loading, rendering, and network optimization.
    Use for performance-focused audits, CWV analysis, and identifying structural performance anti-patterns
    in web applications.
skills:
- name: api-and-interface-design
  path: skills/api-and-interface-design/SKILL.md
  description: Guides stable API and interface design. Use when designing APIs, module boundaries, or
    any public interface. Use when creating REST or GraphQL endpoints, defining type contracts between
    modules, or establishing boundaries between frontend and backend.
- name: browser-testing-with-devtools
  path: skills/browser-testing-with-devtools/SKILL.md
  description: Tests in real browsers via Chrome DevTools MCP. Use when building or debugging anything
    that runs in a browser. Use when you need to inspect the DOM, capture console errors, analyze network
    requests, profile performance, or verify visual output with real runtime data. Requires the chrome-devtools
    MCP server to be configured.
- name: ci-cd-and-automation
  path: skills/ci-cd-and-automation/SKILL.md
  description: Automates CI/CD pipeline setup. Use when setting up or modifying build and deployment pipelines.
    Use when you need to automate quality gates, configure test runners in CI, or establish deployment
    strategies.
- name: code-review-and-quality
  path: skills/code-review-and-quality/SKILL.md
  description: Conducts multi-axis code review. Use before merging any change. Use when reviewing code
    written by yourself, another agent, or a human. Use when you need to assess code quality across multiple
    dimensions before it enters the main branch.
- name: code-simplification
  path: skills/code-simplification/SKILL.md
  description: Simplifies code for clarity. Use when refactoring code for clarity without changing behavior.
    Use when code works but is harder to read, maintain, or extend than it should be. Use when reviewing
    code that has accumulated unnecessary complexity.
  scripts:
  - path: skills/code-simplification/scripts/simplify-ignore.sh
    runtime: bash
    description: Protect simplify-ignore blocks when the optional Claude Code lifecycle hook is registered.
- name: constraint-driven-development
  path: skills/constraint-driven-development/SKILL.md
  description: Establishes a project's quality bar as a written contract and stops agents quietly lowering
    it. Interviews the user on which dimensions matter, supplies sane default thresholds when they have
    no number in mind, records everything in CONSTRAINTS.md, and watches the diff for a weakened bar —
    new @ts-ignore or eslint-disable suppressions, skipped or deleted tests, assertions stripped out,
    unimplemented stubs, thresholds edited down. Use when no quality bar is written down, when the user
    says "set up constraints" or "define our standards", when the user wants dimensions they care about
    — accessibility, web performance, coverage — set up as enforced constraints, when an agent keeps silencing
    checks or skipping tests to get to green, when you need a coverage or performance threshold and don't
    know what number to pick, or when an agent writes more code than anyone will read.
- name: context-engineering
  path: skills/context-engineering/SKILL.md
  description: Optimizes agent context setup. Use when starting a new session, when agent output quality
    degrades, when switching between tasks, or when you need to configure rules files and context for
    a project.
- name: debugging-and-error-recovery
  path: skills/debugging-and-error-recovery/SKILL.md
  description: Guides systematic root-cause debugging. Use when tests fail, builds break, something that
    worked yesterday broke, behavior doesn't match expectations, or you encounter any unexpected error.
    Use when you need to figure out what broke and why — a systematic approach to finding and fixing the
    root cause rather than guessing.
- name: deprecation-and-migration
  path: skills/deprecation-and-migration/SKILL.md
  description: Manages deprecation and migration. Use when removing old systems, APIs, or features. Use
    when migrating users from one implementation to another. Use when migrating a database schema in production,
    such as renaming or dropping a column without downtime (expand/contract). Use when deciding whether
    to maintain or sunset existing code.
- name: documentation-and-adrs
  path: skills/documentation-and-adrs/SKILL.md
  description: Records decisions and documentation. Use when you need to document an architecture decision
    (ADR) or the reasoning behind a design choice, when changing public APIs, shipping features, or when
    you need to record context that future engineers and agents will need to understand the codebase.
- name: doubt-driven-development
  path: skills/doubt-driven-development/SKILL.md
  description: Subjects every non-trivial decision to a fresh-context adversarial review before it stands.
    Use when you want every assumption cross-examined before proceeding, when stress-testing a plan for
    hidden failure modes, when correctness matters more than speed, when working in unfamiliar code, when
    stakes are high (production auth, security-sensitive logic, a high-stakes migration, irreversible
    operations), or any time a confident output would be cheaper to verify now than to debug later.
- name: frontend-ui-engineering
  path: skills/frontend-ui-engineering/SKILL.md
  description: Builds production-quality, accessible, responsive user-facing UIs. Use when building or
    modifying interfaces and pages, creating components, implementing layouts, meeting WCAG accessibility
    requirements, managing state, or when the output needs to look and feel production-quality rather
    than AI-generated.
- name: git-workflow-and-versioning
  path: skills/git-workflow-and-versioning/SKILL.md
  description: Structures git workflow practices. Use when making any code change. Use when committing,
    branching, resolving conflicts, splitting uncommitted work in a messy working tree into clean atomic
    commits, opening or reviewing a pull request (PR), pushing to a remote, or when you need to organize
    work across multiple parallel streams. Use when cutting a release, choosing a semantic version bump,
    tagging, or writing a changelog.
- name: idea-refine
  path: skills/idea-refine/SKILL.md
  description: Refines raw ideas into sharp, actionable concepts through structured divergent and convergent
    thinking. Use when an idea is still vague, when you need to stress-test assumptions before committing
    to a plan, or when you want to expand options before converging on one. Triggers on "ideate", "refine
    this idea", or "stress-test my plan".
  scripts:
  - path: skills/idea-refine/scripts/idea-refine.sh
    runtime: bash
    description: Idea refine.
- name: incremental-implementation
  path: skills/incremental-implementation/SKILL.md
  description: Delivers changes incrementally in thin, verifiable slices. Use when implementing any feature
    or change that touches more than one file, or when picking up the next task from a plan. Use when
    rolling a change out behind a feature flag, when you're about to write a large amount of code at once,
    or when a task feels too big to land in one step.
- name: interview-me
  path: skills/interview-me/SKILL.md
  description: Extracts what the user actually wants instead of what they think they should want. Achieves
    this through one-question-at-a-time interview until ~95% confidence about the underlying intent. Use
    when an ask is underspecified ("build me X" without "for whom" or "why now"), when the user explicitly
    invokes ("interview me", "grill me", "are we sure?", "stress-test my thinking"), or when you catch
    yourself silently filling in ambiguous requirements before any plan, spec, or code exists.
- name: observability-and-instrumentation
  path: skills/observability-and-instrumentation/SKILL.md
  description: Instruments code so production behavior is visible and diagnosable. Use when adding logging,
    metrics, tracing, or alerting. Use when shipping any feature that runs in production and you need
    evidence it works. Use when production issues are reported but you can't tell what happened from the
    available data.
- name: performance-optimization
  path: skills/performance-optimization/SKILL.md
  description: Optimizes application performance across frontend, backend, queries, and databases. Use
    when performance requirements exist, when you suspect performance regressions, when Core Web Vitals
    or load times need improvement, when N+1 query patterns need fixing, or when profiling reveals bottlenecks.
- name: planning-and-task-breakdown
  path: skills/planning-and-task-breakdown/SKILL.md
  description: Breaks work into ordered tasks. Use when you have a spec or clear requirements and need
    to break work into implementable tasks. Use when a task feels too large to start, when you need to
    estimate scope, or when parallel work is possible.
- name: security-and-hardening
  path: skills/security-and-hardening/SKILL.md
  description: Hardens code against vulnerabilities. Use when auditing an input handler for vulnerabilities,
    when handling user input, authentication, data storage, or external integrations, or when checking
    a login flow is safe against the OWASP Top Ten. Use when building any feature that accepts untrusted
    data, manages user sessions, or interacts with third-party services. Use when auditing dependencies
    for known vulnerabilities, triaging package-manager audit findings, or assessing supply-chain risk
    in a new package. Use when personal data or privacy compliance (GDPR, CCPA) is involved.
- name: shipping-and-launch
  path: skills/shipping-and-launch/SKILL.md
  description: Prepares production launches. Use when preparing to deploy to production, or when asking
    what needs to be in place before shipping. Use when you need a pre-launch checklist, when setting
    up monitoring, when planning a staged rollout, or when you need a rollback strategy.
- name: source-driven-development
  path: skills/source-driven-development/SKILL.md
  description: Grounds every implementation decision in official documentation. Use when you want to verify
    an approach against the official docs before implementing it, or when you want authoritative, source-cited
    code free from outdated patterns. Use when building with any framework or library where correctness
    matters.
  scripts:
  - path: skills/source-driven-development/scripts/sdd-cache-post.sh
    runtime: bash
    description: Store a completed WebFetch response for the optional source-driven-development cache
      hook.
  - path: skills/source-driven-development/scripts/sdd-cache-pre.sh
    runtime: bash
    description: Revalidate and serve source-driven-development cache entries before WebFetch.
- name: spec-driven-development
  path: skills/spec-driven-development/SKILL.md
  description: Creates specs before coding. Use when starting a new project, feature, or significant change
    and no specification exists yet. Use when drafting a PRD or requirements document with objectives
    and scope, or when requirements are unclear, ambiguous, or only exist as a vague idea. Use when a
    single requirement spans several independently testable capabilities and needs decomposing into a
    capability map of modules before specifying.
- name: test-driven-development
  path: skills/test-driven-development/SKILL.md
  description: Drives development with tests using the red-green-refactor loop. Use when implementing
    any logic, fixing any bug, or changing any behavior. Use when you need to prove that code works, when
    a bug report arrives, or when you're about to modify existing functionality.
- name: using-agent-skills
  path: skills/using-agent-skills/SKILL.md
  description: Discovers and invokes agent skills. Use when starting a session, or when you need to decide
    which skill or workflow applies to the piece of work at hand. This is the meta-skill that governs
    how all other skills are discovered and invoked.
  scripts:
  - path: skills/using-agent-skills/scripts/session-start.sh
    runtime: bash
    description: Inject the using-agent-skills meta-skill into a new Claude Code session.
commands:
- name: build
  path: commands/build.md
  description: Implement tasks incrementally — build, test, verify, commit. Add "auto" to run the whole
    plan in one approved pass.
- name: code-simplify
  path: commands/code-simplify.md
  description: Simplify code for clarity and maintainability — reduce complexity without changing behavior
- name: constraints
  path: commands/constraints.md
  description: Define and enforce this project's quality bar — interview, sane defaults, CONSTRAINTS.md
- name: plan
  path: commands/plan.md
  description: Break work into small verifiable tasks with acceptance criteria and dependency ordering
- name: review
  path: commands/review.md
  description: Conduct a five-axis code review — correctness, readability, architecture, security, performance
- name: ship
  path: commands/ship.md
  description: Run the pre-launch checklist via parallel fan-out to specialist personas, then synthesize
    a go/no-go decision
- name: spec
  path: commands/spec.md
  description: Start spec-driven development — write a structured specification before writing code
- name: test
  path: commands/test.md
  description: Run TDD workflow — write failing tests, implement, verify. For bugs, use the Prove-It pattern.
- name: webperf
  path: commands/webperf.md
  description: Run a web performance audit via the web-performance-auditor persona
references:
- id: accessibility-checklist
  path: references/accessibility-checklist.md
- id: definition-of-done
  path: references/definition-of-done.md
- id: observability-checklist
  path: references/observability-checklist.md
- id: orchestration-patterns
  path: references/orchestration-patterns.md
- id: performance-checklist
  path: references/performance-checklist.md
- id: security-checklist
  path: references/security-checklist.md
- id: testing-patterns
  path: references/testing-patterns.md
- id: profile-docs
  path: docs
hooks:
- id: generated-claude-code-sessionstart-1-1
  trigger: session_start
  command: ./hooks/generated-claude-code-sessionstart-1-1.sh
  description: agent-skills session start hook
  platforms:
  - claude-code
