mcp:
  path: mcp.jsonc
  requiredEnv: []
hooks:
- id: azure-telemetry-post-tool-use
  trigger: post_tool_use
  command: ./hooks/scripts/track-telemetry.sh
  timeout: 30
  description: Tracks Azure skill, MCP tool, and bundled reference-file usage after tool calls while respecting AZURE_MCP_COLLECT_TELEMETRY=false.
