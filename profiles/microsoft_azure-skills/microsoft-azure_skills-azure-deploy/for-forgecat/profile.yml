name: microsoft-azure_skills-azure-deploy
version: 0.0.1
description: 'Execute Azure deployments for ALREADY-PREPARED applications that have
  existing .azure/deployment-plan.md and infrastructure files. DO NOT use this skill
  when the user asks to CREATE a new application — use azure-prepare instead. This
  skill runs azd up, azd deploy, terraform apply, and az deployment commands with
  built-in error recovery. Requires .azure/deployment-plan.md from azure-prepare and
  validated status from azure-validate. WHEN: "run azd up", "run azd deploy", "execute
  deployment", "push to production", "push to cloud", "go live", "ship it", "bicep
  deploy", "terraform apply", "publish to Azure", "launch on Azure". DO NOT USE WHEN:
  "create and deploy", "build and deploy", "create a new app", "set up infrastructure",
  "create and deploy to Azure using Terraform" — use azure-prepare for these.'
repository: https://github.com/microsoft/azure-skills
license: MIT
visibility: public
compatibility:
  platforms:
    tested:
    - claude-code
    - codex
    partial:
    - cursor
  models:
    recommended: []
    minimum: []
skills:
- name: azure-deploy
  path: skills/azure-deploy/SKILL.md
  description: 'Execute Azure deployments for ALREADY-PREPARED applications that have
