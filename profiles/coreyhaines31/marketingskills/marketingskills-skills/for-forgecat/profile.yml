- name: popups
  path: skills/popups/SKILL.md
  description: When the user wants to create or optimize popups, modals, overlays, slide-ins, or banners for conversion purposes.
    Also use when the user mentions "exit intent," "popup conversions," "modal optimization," "lead capture popup," "email
    popup," "announcement banner," "overlay," "collect emails with a popup," "exit popup," "scroll trigger," "sticky bar,"
