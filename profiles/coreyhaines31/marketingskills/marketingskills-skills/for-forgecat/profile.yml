- name: marketing-ideas
  path: skills/marketing-ideas/SKILL.md
  description: When the user needs marketing ideas, inspiration, or strategies for their SaaS or software product. Also use
    when the user asks for 'marketing ideas,' 'growth ideas,' 'how to market,' 'marketing strategies,' 'marketing tactics,'
    'ways to promote,' 'ideas to grow,' 'what else can I try,' 'I don't know how to market this,' 'brainstorm marketing,'
    or 'what marketing should I do.' Use this as a starting point whenever someone is stuck or looking for inspiration on
    how to grow. For specific channel execution, see the relevant skill (ads, social, emails, etc.).
- name: marketing-plan
  path: skills/marketing-plan/SKILL.md
  description: When the user needs a comprehensive marketing plan for a client, a company they advise, or their own product.
    Also use when the user mentions "marketing plan," "growth plan," "GTM plan," "go-to-market plan," "AARRR plan," "90-day
    marketing plan," "12-month marketing roadmap," "fractional CMO plan," or "fCMO plan." Generates an exhaustive 13-section
    plan structured by AARRR (Acquisition, Activation, Retention, Referral, Revenue), customized to the client's current budget,
    team, and stage, mapped to future funding milestones, cross-referenced with the 139-idea marketing-ideas library and an
    embedded 17-section current-state audit rubric, with a full marketing operations stack showing which skills and MCP/API
    integrations execute each part. Outputs a Notion-paste-ready markdown document. For positioning and ICP context before
    planning, see product-marketing. For stage-specific deep work, see onboarding, signup, emails, referrals, pricing.
- name: marketing-psychology
  path: skills/marketing-psychology/SKILL.md
  description: When the user wants to apply psychological principles, mental models, or behavioral science to marketing. Also
    use when the user mentions 'psychology,' 'mental models,' 'cognitive bias,' 'persuasion,' 'behavioral science,' 'why people
    buy,' 'decision-making,' 'consumer behavior,' 'anchoring,' 'social proof,' 'scarcity,' 'loss aversion,' 'framing,' or
    'nudge.' Use this whenever someone wants to understand or leverage how people think and make decisions in a marketing
