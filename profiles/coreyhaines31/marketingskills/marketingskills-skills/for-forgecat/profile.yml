name: '@forgecat/marketingskills-skills'
version: 0.0.0
description: Marketing agent skills for conversion optimization, copywriting, SEO, paid ads, analytics, growth, and go-to-market
  workflows.
repository: https://github.com/coreyhaines31/marketingskills
license: MIT
visibility: public
sourcePlatform: claude-code
compatibility:
  platforms:
    tested:
    - claude-code
    partial:
    - cursor
    - codex
  models:
    recommended: []
    minimum: []
skills:
- name: ab-testing
  path: skills/ab-testing/SKILL.md
  description: When the user wants to plan, design, or implement an A/B test or experiment, or build a growth experimentation
    program. Also use when the user mentions "A/B test," "split test," "experiment," "test this change," "variant copy," "multivariate
    test," "hypothesis," "should I test this," "which version is better," "test two versions," "statistical significance,"
    "how long should I run this test," "growth experiments," "experiment velocity," "experiment backlog," "ICE score," "experimentation
    program," or "experiment playbook." Use this whenever someone is comparing two approaches and wants to measure which performs
    better, or when they want to build a systematic experimentation practice. For tracking implementation, see analytics.
    For page-level conversion optimization, see cro.
- name: ad-creative
  path: skills/ad-creative/SKILL.md
  description: When the user wants to generate, iterate, or scale ad creative — headlines, descriptions, primary text, or
    full ad variations — for any paid advertising platform. Also use when the user mentions 'ad copy variations,' 'ad creative,'
    'generate headlines,' 'RSA headlines,' 'bulk ad copy,' 'ad iterations,' 'creative testing,' 'ad performance optimization,'
    'write me some ads,' 'Facebook ad copy,' 'Google ad headlines,' 'LinkedIn ad text,' or 'I need more ad variations.' Use
    this whenever someone needs to produce ad copy at scale or iterate on existing ads. For campaign strategy and targeting,
    see ads. For landing page copy, see copywriting.
- name: ads
  path: skills/ads/SKILL.md
  description: When the user wants help with paid advertising campaigns on Google Ads, Meta (Facebook/Instagram), LinkedIn,
    Twitter/X, or other ad platforms. Also use when the user mentions 'PPC,' 'paid media,' 'ROAS,' 'CPA,' 'ad campaign,' 'retargeting,'
    'audience targeting,' 'Google Ads,' 'Facebook ads,' 'LinkedIn ads,' 'ad budget,' 'cost per click,' 'ad spend,' or 'should
    I run ads.' Use this for campaign strategy, audience targeting, bidding, and optimization. For bulk ad creative generation
    and iteration, see ad-creative. For landing page optimization, see cro.
- name: ai-seo
  path: skills/ai-seo/SKILL.md
  description: When the user wants to optimize content for AI search engines, get cited by LLMs, or appear in AI-generated
    answers. Also use when the user mentions 'AI SEO,' 'AEO,' 'GEO,' 'LLMO,' 'answer engine optimization,' 'generative engine
    optimization,' 'LLM optimization,' 'AI Overviews,' 'optimize for ChatGPT,' 'optimize for Perplexity,' 'AI citations,'
    'AI visibility,' 'zero-click search,' 'how do I show up in AI answers,' 'LLM mentions,' or 'optimize for Claude/Gemini.'
    Use this whenever someone wants their content to be cited or surfaced by AI assistants and AI search engines. For traditional
    technical and on-page SEO audits, see seo-audit. For structured data implementation, see schema.
- name: analytics
  path: skills/analytics/SKILL.md
  description: When the user wants to set up, improve, or audit analytics tracking and measurement. Also use when the user
    mentions "set up tracking," "GA4," "Google Analytics," "conversion tracking," "event tracking," "UTM parameters," "tag
    manager," "GTM," "analytics implementation," "tracking plan," "how do I measure this," "track conversions," "attribution,"
    "Mixpanel," "Segment," "are my events firing," or "analytics isn't working." Use this whenever someone asks how to know
    if something is working or wants to measure marketing results. For A/B test measurement, see ab-testing.
- name: aso
  path: skills/aso/SKILL.md
  description: When the user wants to audit or optimize an App Store or Google Play listing. Also use when the user mentions
    'ASO audit,' 'app store optimization,' 'optimize my app listing,' 'improve app visibility,' 'app store ranking,' 'audit
    my listing,' 'why aren't people downloading my app,' 'improve my app conversion,' 'keyword optimization for app,' or 'compare
    my app to competitors.' Use when the user shares an App Store or Google Play URL and wants to improve it.
- name: churn-prevention
  path: skills/churn-prevention/SKILL.md
  description: When the user wants to reduce churn, build cancellation flows, set up save offers, recover failed payments,
    or implement retention strategies. Also use when the user mentions 'churn,' 'cancel flow,' 'offboarding,' 'save offer,'
    'dunning,' 'failed payment recovery,' 'win-back,' 'retention,' 'exit survey,' 'pause subscription,' 'involuntary churn,'
    'people keep canceling,' 'churn rate is too high,' 'how do I keep users,' or 'customers are leaving.' Use this whenever
    someone is losing subscribers or wants to build systems to prevent it. For post-cancel win-back email sequences, see emails.
    For in-app upgrade paywalls, see paywalls.
- name: co-marketing
  path: skills/co-marketing/SKILL.md
  description: When the user wants to find co-marketing partners, plan joint campaigns, or brainstorm partnership opportunities.
    Use when the user says 'co-marketing,' 'partner marketing,' 'joint campaign,' 'who should we partner with,' 'integration
    marketing,' 'cross-promotion,' 'collaborate with another company,' 'partnership ideas,' or 'co-brand.' For customer referral
    programs, see referrals. For launch-specific partnerships, see launch.
- name: cold-email
  path: skills/cold-email/SKILL.md
  description: Write B2B cold emails and follow-up sequences that get replies. Use when the user wants to write cold outreach
    emails, prospecting emails, cold email campaigns, sales development emails, or SDR emails. Also use when the user mentions
    "cold outreach," "prospecting email," "outbound email," "email to leads," "reach out to prospects," "sales email," "follow-up
    email sequence," "nobody's replying to my emails," or "how do I write a cold email." Covers subject lines, opening lines,
    body copy, CTAs, personalization, and multi-touch follow-up sequences. For warm/lifecycle email sequences, see emails.
    For sales collateral beyond emails, see sales-enablement.
- name: community-marketing
  path: skills/community-marketing/SKILL.md
  description: 'Build and leverage online communities to drive product growth and brand loyalty. Use when the user wants to
    create a community strategy, grow a Discord or Slack community, manage a forum or subreddit, build brand advocates, increase
    word-of-mouth, drive community-led growth, engage users post-signup, or turn customers into evangelists. Trigger phrases:
    "build a community," "community strategy," "Discord community," "Slack community," "community-led growth," "brand advocates,"
    "user community," "forum strategy," "community engagement," "grow our community," "ambassador program," "community flywheel."'
- name: competitor-profiling
  path: skills/competitor-profiling/SKILL.md
  description: When the user wants to research, profile, or analyze competitors from their URLs. Also use when the user mentions
    'competitor profile,' 'competitor research,' 'competitor analysis,' 'profile this competitor,' 'analyze competitor,' 'competitive
    intelligence,' 'competitor deep dive,' 'who are my competitors,' 'competitor landscape,' 'competitor dossier,' 'competitive
    audit,' or 'research these competitors.' Input is a list of competitor URLs. Output is structured competitor profile markdown
    files. For creating comparison/alternative pages from profiles, see competitors. For sales-specific battle cards, see
    sales-enablement.
- name: competitors
  path: skills/competitors/SKILL.md
  description: 'When the user wants to create competitor comparison or alternative pages for SEO and sales enablement. Also
    use when the user mentions ''alternative page,'' ''vs page,'' ''competitor comparison,'' ''comparison page,'' ''[Product]
    vs [Product],'' ''[Product] alternative,'' ''competitive landing pages,'' ''how do we compare to X,'' ''battle card,''
    or ''competitor teardown.'' Use this for any content that positions your product against competitors. Covers four formats:
    singular alternative, plural alternatives, you vs competitor, and competitor vs competitor. For sales-specific competitor
    docs, see sales-enablement.'
- name: content-strategy
  path: skills/content-strategy/SKILL.md
  description: When the user wants to plan a content strategy, decide what content to create, or figure out what topics to
    cover. Also use when the user mentions "content strategy," "what should I write about," "content ideas," "blog strategy,"
    "topic clusters," "content planning," "editorial calendar," "content marketing," "content roadmap," "what content should
    I create," "blog topics," "content pillars," or "I don't know what to write." Use this whenever someone needs help deciding
    what content to produce, not just writing it. For writing individual pieces, see copywriting. For SEO-specific audits,
    see seo-audit. For social media content specifically, see social.
- name: copy-editing
  path: skills/copy-editing/SKILL.md
  description: When the user wants to edit, review, or improve existing marketing copy, or refresh outdated content. Also
    use when the user mentions 'edit this copy,' 'review my copy,' 'copy feedback,' 'proofread,' 'polish this,' 'make this
    better,' 'copy sweep,' 'tighten this up,' 'this reads awkwardly,' 'clean up this text,' 'too wordy,' 'sharpen the messaging,'
    'refresh this content,' 'update this page,' 'this content is outdated,' or 'content audit.' Use this when the user already
    has copy and wants it improved or refreshed rather than rewritten from scratch. For writing new copy, see copywriting.
- name: copywriting
  path: skills/copywriting/SKILL.md
  description: When the user wants to write, rewrite, or improve marketing copy for any page — including homepage, landing
    pages, pricing pages, feature pages, about pages, or product pages. Also use when the user says "write copy for," "improve
    this copy," "rewrite this page," "marketing copy," "headline help," "CTA copy," "value proposition," "tagline," "subheadline,"
    "hero section copy," "above the fold," "this copy is weak," "make this more compelling," or "help me describe my product."
    Use this whenever someone is working on website text that needs to persuade or convert. For email copy, see emails. For
    popup copy, see popups. For editing existing copy, see copy-editing.
- name: cro
  path: skills/cro/SKILL.md
  description: When the user wants to optimize, improve, or increase conversions on any marketing page or form — including
    homepage, landing pages, pricing pages, feature pages, lead capture forms, or contact forms. Also use when the user says
    'CRO,' 'conversion rate optimization,' 'this page isn't converting,' 'improve conversions,' 'why isn't this page working,'
    'my landing page sucks,' 'form abandonment,' 'nobody's converting,' 'low conversion rate,' or 'this page needs work.'
    Use this even if the user just shares a URL and asks for feedback. For signup/registration flows, see signup. For post-signup
    activation, see onboarding. For popups/modals, see popups.
- name: customer-research
  path: skills/customer-research/SKILL.md
  description: When the user wants to conduct, analyze, or synthesize customer research. Use when the user mentions "customer
    research," "ICP research," "talk to customers," "analyze transcripts," "customer interviews," "survey analysis," "support
    ticket analysis," "voice of customer," "VOC," "build personas," "customer personas," "jobs to be done," "JTBD," "what
    do customers say," "what are customers struggling with," "Reddit mining," "G2 reviews," "review mining," "digital watering
    holes," "community research," "forum research," "competitor reviews," "customer sentiment," or "find out why customers
    churn/convert/buy." Use for both analyzing existing research assets AND gathering new research from online sources. For
    writing copy informed by research, see copywriting. For acting on research to improve pages, see cro.
- name: directory-submissions
  path: skills/directory-submissions/SKILL.md
  description: When the user wants to submit their product to startup, SaaS, AI, agent, MCP, no-code, or review directories
    for backlinks, domain rating, and discovery. Also use when the user mentions "directory submissions," "submit to directories,"
    "backlinks from directories," "list my product," "submit to Product Hunt," "BetaList," "TAAFT," "Futurepedia," "G2 listing,"
    "Capterra listing," "AlternativeTo," "SaaSHub," "AI directories," "MCP registry," "agent directory," "dofollow backlinks,"
    "launch directories," or "directory tracker." Use this whenever someone is planning the directory layer of a product launch
    or an ongoing backlink campaign. For the broader launch moment, see launch. For programmatic SEO pages that should live
    behind these backlinks, see programmatic-seo. For AI citation optimization, see ai-seo.
- name: emails
  path: skills/emails/SKILL.md
  description: When the user wants to create or optimize an email sequence, drip campaign, automated email flow, or lifecycle
    email program. Also use when the user mentions "email sequence," "drip campaign," "nurture sequence," "onboarding emails,"
    "welcome sequence," "re-engagement emails," "email automation," "lifecycle emails," "trigger-based emails," "email funnel,"
    "email workflow," "what emails should I send," "welcome series," or "email cadence." Use this for any multi-email automated
    flow. For cold outreach emails, see cold-email. For in-app onboarding, see onboarding.
- name: free-tools
  path: skills/free-tools/SKILL.md
  description: When the user wants to plan, evaluate, or build a free tool for marketing purposes — lead generation, SEO value,
    or brand awareness. Also use when the user mentions "engineering as marketing," "free tool," "marketing tool," "calculator,"
    "generator," "interactive tool," "lead gen tool," "build a tool for leads," "free resource," "ROI calculator," "grader
    tool," "audit tool," "should I build a free tool," or "tools for lead gen." Use this whenever someone wants to build something
    useful and give it away to attract leads or earn links. For downloadable content lead magnets (ebooks, checklists, templates),
    see lead-magnets.
- name: image
  path: skills/image/SKILL.md
  description: When the user wants to create, generate, edit, or optimize images for marketing — blog heroes, social graphics,
    product mockups, profile banners, listing visuals, or brand assets. Also use when the user mentions 'AI image generation,'
    'generate an image,' 'create a graphic,' 'product mockup,' 'hero image,' 'social media graphic,' 'banner image,' 'cover
    photo,' 'profile banner,' 'listing screenshot,' 'Flux,' 'Flux Kontext,' 'Midjourney,' 'DALL-E,' 'GPT Image,' 'ChatGPT
