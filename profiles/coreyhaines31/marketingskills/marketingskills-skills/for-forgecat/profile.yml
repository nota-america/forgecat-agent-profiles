- name: paywalls
  path: skills/paywalls/SKILL.md
  description: When the user wants to create or optimize in-app paywalls, upgrade screens, upsell modals, or feature gates.
    Also use when the user mentions "paywall," "upgrade screen," "upgrade modal," "upsell," "feature gate," "convert free
    to paid," "freemium conversion," "trial expiration screen," "limit reached screen," "plan upgrade prompt," "in-app pricing,"
    "free users won't upgrade," "trial to paid conversion," or "how do I get users to pay." Use this for any in-product moment
