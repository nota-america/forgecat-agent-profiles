- name: launch
  path: skills/launch/SKILL.md
  description: When the user wants to plan a product launch, feature announcement, or release strategy. Also use when the
    user mentions 'launch,' 'Product Hunt,' 'feature release,' 'announcement,' 'go-to-market,' 'beta launch,' 'early access,'
    'waitlist,' 'product update,' 'how do I launch this,' 'launch checklist,' 'GTM plan,' or 'we're about to ship.' Use this
