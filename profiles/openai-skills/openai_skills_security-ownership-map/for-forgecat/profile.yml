name: "@forgecat/openai_skills_security-ownership-map"
version: 0.0.10
description: 'Analyze git repositories to build a security ownership topology (people-to-file),
  compute bus factor and sensitive-code ownership, and export CSV/JSON for graph databases
  and visualization. Trigger only when the user explicitly wants a security-oriented
  ownership or bus-factor analysis grounded in git history (for example: orphaned
  sensitive code, security maintainers, CODEOWNERS reality checks for risk, sensitive
  hotspots, or ownership clusters). Do not trigger for general maintainer lists or
  non-security ownership questions.'
repository: https://github.com/openai/skills
license: Apache-2.0
visibility: public
sourcePlatform: codex
compatibility:
  platforms:
    tested:
      - claude-code
      - codex
      - cursor
    partial: []
  models:
    recommended:
    - gpt-5.4
    minimum:
    - gpt-4o
skills:
- name: security-ownership-map
  path: skills/security-ownership-map/SKILL.md
  description: 'Analyze git repositories to build a security ownership topology (people-to-file),
    compute bus factor and sensitive-code ownership, and export CSV/JSON for graph
    databases and visualization. Trigger only when the user explicitly wants a security-oriented
    ownership or bus-factor analysis grounded in git history (for example: orphaned
    sensitive code, security maintainers, CODEOWNERS reality checks for risk, sensitive
    hotspots, or ownership clusters). Do not trigger for general maintainer lists
    or non-security ownership questions.'
  scripts:
  - path: skills/security-ownership-map/scripts/build_ownership_map.py
  - path: skills/security-ownership-map/scripts/community_maintainers.py
  - path: skills/security-ownership-map/scripts/query_ownership.py
  - path: skills/security-ownership-map/scripts/run_ownership_map.py
