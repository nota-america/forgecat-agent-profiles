name: "@forgecat/openai_skills_spreadsheet"
version: 0.0.9
description: Use when tasks involve creating, editing, analyzing, or formatting spreadsheets
  (`.xlsx`, `.csv`, `.tsv`) with formula-aware workflows, cached recalculation, and
  visual review.
repository: https://github.com/openai/skills
license: Apache-2.0
visibility: public
sourcePlatform: codex
compatibility:
  platforms:
    tested:
      - claude-code
      - codex
      - cursor
    partial: []
  models:
    recommended:
    - gpt-5.4
    minimum:
    - gpt-4o
skills:
- name: spreadsheet
  path: skills/spreadsheet/SKILL.md
  description: Use when tasks involve creating, editing, analyzing, or formatting
    spreadsheets (`.xlsx`, `.csv`, `.tsv`) with formula-aware workflows, cached recalculation,
    and visual review.
  scripts:
  - path: skills/spreadsheet/references/examples/openpyxl/create_basic_spreadsheet.py
  - path: skills/spreadsheet/references/examples/openpyxl/create_spreadsheet_with_styling.py
  - path: skills/spreadsheet/references/examples/openpyxl/read_existing_spreadsheet.py
  - path: skills/spreadsheet/references/examples/openpyxl/styling_spreadsheet.py
