name: "@forgecat/openai_skills_screenshot"
version: 0.0.9
description: Use when the user explicitly asks for a desktop or system screenshot
  (full screen, specific app or window, or a pixel region), or when tool-specific
  capture capabilities are unavailable and an OS-level capture is needed.
repository: https://github.com/openai/skills
license: Apache-2.0
visibility: public
sourcePlatform: codex
compatibility:
  platforms:
    tested:
      - claude-code
      - codex
      - cursor
    partial: []
  models:
    recommended:
    - gpt-5.4
    minimum:
    - gpt-4o
skills:
- name: screenshot
  path: skills/screenshot/SKILL.md
  description: Use when the user explicitly asks for a desktop or system screenshot
    (full screen, specific app or window, or a pixel region), or when tool-specific
    capture capabilities are unavailable and an OS-level capture is needed.
  scripts:
  - path: skills/screenshot/scripts/ensure_macos_permissions.sh
  - path: skills/screenshot/scripts/take_screenshot.py
