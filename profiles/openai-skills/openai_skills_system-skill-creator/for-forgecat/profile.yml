name: "@forgecat/openai_skills_system-skill-creator"
version: 0.0.9
description: Guide for creating effective skills. This skill should be used when users
  want to create a new skill (or update an existing skill) that extends Codex's capabilities
  with specialized knowledge, workflows, or tool integrations.
repository: https://github.com/openai/skills
license: Apache-2.0
visibility: public
sourcePlatform: codex
compatibility:
  platforms:
    tested:
      - claude-code
      - codex
      - cursor
    partial: []
  models:
    recommended:
    - gpt-5.4
    minimum:
    - gpt-4o
skills:
- name: skill-creator
  path: skills/skill-creator/SKILL.md
  description: Guide for creating effective skills. This skill should be used when
    users want to create a new skill (or update an existing skill) that extends Codex's
    capabilities with specialized knowledge, workflows, or tool integrations.
  scripts:
  - path: skills/skill-creator/scripts/generate_openai_yaml.py
  - path: skills/skill-creator/scripts/init_skill.py
  - path: skills/skill-creator/scripts/quick_validate.py
