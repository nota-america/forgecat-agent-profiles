name: "@forgecat/openai_skills_figma-generate-library"
version: 0.0.10
description: Build or update a professional-grade design system in Figma from a codebase.
  Use when the user wants to create variables/tokens, build component libraries, set
  up theming (light/dark modes), document foundations, or reconcile gaps between code
  and Figma. This skill teaches WHAT to build and in WHAT ORDER — it complements the
  `figma-use` skill which teaches HOW to call the Plugin API. Both skills should be
  loaded together.
repository: https://github.com/openai/skills
license: LicenseRef-Figma-Developer-Terms
visibility: public
sourcePlatform: codex
compatibility:
  platforms:
    tested:
      - claude-code
      - codex
      - cursor
    partial: []
  models:
    recommended:
    - gpt-5.4
    minimum:
    - gpt-4o
skills:
- name: figma-generate-library
  path: skills/figma-generate-library/SKILL.md
  description: Build or update a professional-grade design system in Figma from a
    codebase. Use when the user wants to create variables/tokens, build component
    libraries, set up theming (light/dark modes), document foundations, or reconcile
    gaps between code and Figma. This skill teaches WHAT to build and in WHAT ORDER
    — it complements the `figma-use` skill which teaches HOW to call the Plugin API.
    Both skills should be loaded together.
  scripts:
  - path: skills/figma-generate-library/scripts/bindVariablesToComponent.js
  - path: skills/figma-generate-library/scripts/cleanupOrphans.js
  - path: skills/figma-generate-library/scripts/createComponentWithVariants.js
  - path: skills/figma-generate-library/scripts/createDocumentationPage.js
  - path: skills/figma-generate-library/scripts/createSemanticTokens.js
  - path: skills/figma-generate-library/scripts/createVariableCollection.js
  - path: skills/figma-generate-library/scripts/inspectFileStructure.js
  - path: skills/figma-generate-library/scripts/rehydrateState.js
  - path: skills/figma-generate-library/scripts/validateCreation.js
mcp:
  path: mcp.jsonc
  requiredEnv: []
