name: '@forgecat/openai_skills_notion-knowledge-capture'
description: Capture conversations and decisions into structured Notion pages; use
  when turning chats/notes into wiki entries, how-tos, decisions, or FAQs with proper
  linking.
visibility: public
repository: https://github.com/openai/skills
license: MIT
sourcePlatform: codex
compatibility:
  platforms:
    tested:
    - claude-code
    - codex
    - cursor
    partial:
    - hermes
    - openclaw
    unsupported: []
  models:
    recommended:
    - gpt-5.4
    minimum:
    - gpt-4o
skills:
- name: notion-knowledge-capture
  path: skills/notion-knowledge-capture/SKILL.md
  description: Capture conversations and decisions into structured Notion pages; use
    when turning chats/notes into wiki entries, how-tos, decisions, or FAQs with proper
    linking.
mcp:
  path: mcp.jsonc
