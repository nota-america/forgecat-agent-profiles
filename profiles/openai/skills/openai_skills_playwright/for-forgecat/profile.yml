name: "@forgecat/openai_skills_playwright"
description: Use when the task requires automating a real browser from the terminal
  (navigation, form filling, snapshots, screenshots, data extraction, UI-flow debugging)
  via `playwright-cli` or the bundled wrapper script.
repository: https://github.com/openai/skills
license: Apache-2.0
visibility: public
sourcePlatform: codex
compatibility:
  platforms:
    tested:
      - claude-code
      - codex
      - cursor
    partial:
      - openclaw
      - hermes
  models:
    recommended:
    - gpt-5.4
    minimum:
    - gpt-4o
skills:
- name: playwright
  path: skills/playwright/SKILL.md
  description: Use when the task requires automating a real browser from the terminal
    (navigation, form filling, snapshots, screenshots, data extraction, UI-flow debugging)
    via `playwright-cli` or the bundled wrapper script.
  scripts:
  - path: skills/playwright/scripts/playwright_cli.sh
