name: "@forgecat/openai_skills_slides"
version: 0.0.10
description: Create and edit presentation slide decks (`.pptx`) with PptxGenJS, bundled
  layout helpers, and render/validation utilities. Use when tasks involve building
  a new PowerPoint deck, recreating slides from screenshots/PDFs/reference decks,
  modifying slide content while preserving editable output, adding charts/diagrams/visuals,
  or diagnosing layout issues such as overflow, overlaps, and font substitution.
repository: https://github.com/openai/skills
license: Apache-2.0
visibility: public
sourcePlatform: codex
compatibility:
  platforms:
    tested:
      - claude-code
      - codex
      - cursor
    partial: []
  models:
    recommended:
    - gpt-5.4
    minimum:
    - gpt-4o
skills:
- name: slides
  path: skills/slides/SKILL.md
  description: Create and edit presentation slide decks (`.pptx`) with PptxGenJS,
    bundled layout helpers, and render/validation utilities. Use when tasks involve
    building a new PowerPoint deck, recreating slides from screenshots/PDFs/reference
    decks, modifying slide content while preserving editable output, adding charts/diagrams/visuals,
    or diagnosing layout issues such as overflow, overlaps, and font substitution.
  scripts:
  - path: skills/slides/assets/pptxgenjs_helpers/code.js
  - path: skills/slides/assets/pptxgenjs_helpers/image.js
  - path: skills/slides/assets/pptxgenjs_helpers/index.js
  - path: skills/slides/assets/pptxgenjs_helpers/latex.js
  - path: skills/slides/assets/pptxgenjs_helpers/layout.js
  - path: skills/slides/assets/pptxgenjs_helpers/layout_builders.js
  - path: skills/slides/assets/pptxgenjs_helpers/svg.js
  - path: skills/slides/assets/pptxgenjs_helpers/text.js
  - path: skills/slides/assets/pptxgenjs_helpers/util.js
  - path: skills/slides/scripts/create_montage.py
  - path: skills/slides/scripts/detect_font.py
  - path: skills/slides/scripts/ensure_raster_image.py
  - path: skills/slides/scripts/render_slides.py
  - path: skills/slides/scripts/slides_test.py
