name: "@nota-america-tech/engineering-agent-team"
description: >-
  Self-contained engineering agent team that orchestrates Anthropic Engineering knowledge-work skills through a tech lead
  coordinator and focused architecture, code quality, debug/incident, and release operations agents.
repository: >-
  https://github.com/nota-america/forgecat-agent-profiles/tree/main/profiles/forgecat/forgecat-agent-profiles/engineering-agent-team
license: Apache-2.0
visibility: public
sourcePlatform: multi-platform
compatibility:
  platforms:
    tested:
    - claude-code
    - codex
    partial:
    - cursor
  models:
    recommended: []
    minimum: []
agents:
- name: eng-tech-lead
  path: agents/eng-tech-lead.md
  description: >-
    Central engineering coordinator that routes broad engineering requests, standups, technical documentation, and
    cross-functional work to the right specialist agent or underlying engineering skill.
- name: eng-architecture-agent
  path: agents/eng-architecture-agent.md
  description: >-
    Architecture specialist for ADRs, system design, API boundaries, data modeling, component design, and technical
    trade-off analysis.
- name: eng-code-quality-agent
  path: agents/eng-code-quality-agent.md
  description: >-
    Code quality specialist for PR review, testing strategy, security/performance correctness checks, and technical debt
    prioritization.
- name: eng-debug-incident-agent
  path: agents/eng-debug-incident-agent.md
  description: >-
    Reliability specialist for structured debugging, production issue diagnosis, incident triage, status updates, and
    postmortems.
- name: eng-release-agent
  path: agents/eng-release-agent.md
  description: >-
    Release operations specialist for deployment readiness, rollback planning, release checklists, and production-change
    coordination.
rules:
- name: engineering-agent-orchestration
  path: AGENTS.md
  description: Central orchestration rules for the Engineering agent team.
skills:
- name: standup
  path: skills/standup/SKILL.md
  description: >-
    Generate a standup update from recent activity. Use when preparing for daily standup, summarizing yesterday's commits
    and PRs and ticket moves, formatting work into yesterday/today/blockers, or structuring a few rough notes into a
    shareable update.
- name: code-review
  path: skills/code-review/SKILL.md
  description: >-
    Review code changes for security, performance, and correctness. Trigger with a PR URL or diff, "review this before I
    merge", "is this code safe?", or when checking a change for N+1 queries, injection risks, missing edge cases, or error
    handling gaps.
- name: architecture
  path: skills/architecture/SKILL.md
  description: >-
    Create or evaluate an architecture decision record (ADR). Use when choosing between technologies, documenting a design
    decision with trade-offs and consequences, reviewing a system design proposal, or designing a new component from
    requirements and constraints.
- name: system-design
  path: skills/system-design/SKILL.md
  description: >-
    Design systems, services, and architectures. Trigger with "design a system for", "how should we architect", "system
    design for", "what's the right architecture for", or when the user needs help with API design, data modeling, or service
    boundaries.
- name: debug
  path: skills/debug/SKILL.md
  description: >-
    Structured debugging session - reproduce, isolate, diagnose, and fix. Trigger with an error message or stack trace,
    "this works in staging but not prod", "something broke after the deploy", or when behavior diverges from expected and
    the cause is not obvious.
- name: incident-response
  path: skills/incident-response/SKILL.md
  description: >-
    Run an incident response workflow - triage, communicate, and write postmortem. Trigger with "we have an incident",
    "production is down", an alert that needs severity assessment, a status update mid-incident, or when writing a blameless
    postmortem after resolution.
- name: deploy-checklist
  path: skills/deploy-checklist/SKILL.md
  description: >-
    Pre-deployment verification checklist. Use when about to ship a release, deploying a change with database migrations or
    feature flags, verifying CI status and approvals before going to production, or documenting rollback triggers ahead of
    time.
- name: documentation
  path: skills/documentation/SKILL.md
  description: >-
    Write and maintain technical documentation. Trigger with "write docs for", "document this", "create a README", "write
    a runbook", "onboarding guide", or when the user needs help with API docs, architecture docs, operational runbooks, or
    other technical writing.
- name: tech-debt
  path: skills/tech-debt/SKILL.md
  description: >-
    Identify, categorize, and prioritize technical debt. Trigger with "tech debt", "technical debt audit", "what should we
    refactor", "code health", or when the user asks about code quality, refactoring priorities, or maintenance backlog.
- name: testing-strategy
  path: skills/testing-strategy/SKILL.md
  description: >-
    Design test strategies and test plans. Trigger with "how should we test", "test strategy for", "write tests for", "test
    plan", "what tests do we need", or when the user needs help with testing approaches, coverage, or test architecture.
mcp:
  path: mcp.jsonc
