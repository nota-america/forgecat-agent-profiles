name: "@forgecat/mattpocock_skills"
description: Matt Pocock's public engineering, productivity, and misc agent skills for planning, TDD, debugging, issue workflows, architecture improvement, and concise collaboration.
repository: https://github.com/mattpocock/skills
license: MIT
visibility: public
sourcePlatform: claude-code
compatibility:
  platforms:
    tested:
      - claude-code
    partial:
      - cursor
      - codex
  models:
    recommended: []
    minimum: []
skills:
  - name: diagnose
    path: skills/diagnose/SKILL.md
    description: >-
      Disciplined diagnosis loop for hard bugs and performance regressions. Reproduce → minimise → hypothesise → instrument → fix → regression-test. Use when user says "diagnose this" / "debug this", reports a bug, says something is broken/throwing/failing, or describes a performance regression.
    scripts:
      - path: skills/diagnose/scripts/hitl-loop.template.sh
  - name: grill-with-docs
    path: skills/grill-with-docs/SKILL.md
    description: >-
      Grilling session that challenges your plan against the existing domain model, sharpens terminology, and updates documentation (CONTEXT.md, ADRs) inline as decisions crystallise. Use when user wants to stress-test a plan against their project's language and documented decisions.
  - name: improve-codebase-architecture
    path: skills/improve-codebase-architecture/SKILL.md
    description: >-
      Find deepening opportunities in a codebase, informed by the domain language in CONTEXT.md and the decisions in docs/adr/. Use when the user wants to improve architecture, find refactoring opportunities, consolidate tightly-coupled modules, or make a codebase more testable and AI-navigable.
  - name: prototype
    path: skills/prototype/SKILL.md
    description: >-
      Build a throwaway prototype to flesh out a design before committing to it. Routes between two branches — a runnable terminal app for state/business-logic questions, or several radically different UI variations toggleable from one route. Use when the user wants to prototype, sanity-check a data model or state machine, mock up a UI, explore design options, or says "prototype this", "let me play with it", "try a few designs".
  - name: setup-matt-pocock-skills
    path: skills/setup-matt-pocock-skills/SKILL.md
    description: >-
      Sets up an `## Agent skills` block in AGENTS.md/CLAUDE.md and `docs/agents/` so the engineering skills know this repo's issue tracker (GitHub or local markdown), triage label vocabulary, and domain doc layout. Run before first use of `to-issues`, `to-prd`, `triage`, `diagnose`, `tdd`, `improve-codebase-architecture`, or `zoom-out` — or if those skills appear to be missing context about the issue tracker, triage labels, or domain docs.
  - name: tdd
    path: skills/tdd/SKILL.md
    description: >-
      Test-driven development with red-green-refactor loop. Use when user wants to build features or fix bugs using TDD, mentions "red-green-refactor", wants integration tests, or asks for test-first development.
  - name: to-issues
    path: skills/to-issues/SKILL.md
    description: >-
      Break a plan, spec, or PRD into independently-grabbable issues on the project issue tracker using tracer-bullet vertical slices. Use when user wants to convert a plan into issues, create implementation tickets, or break down work into issues.
  - name: to-prd
    path: skills/to-prd/SKILL.md
    description: >-
      Turn the current conversation context into a PRD and publish it to the project issue tracker. Use when user wants to create a PRD from the current context.
  - name: triage
    path: skills/triage/SKILL.md
    description: >-
      Triage issues through a state machine driven by triage roles. Use when user wants to create an issue, triage issues, review incoming bugs or feature requests, prepare issues for an AFK agent, or manage issue workflow.
  - name: zoom-out
    path: skills/zoom-out/SKILL.md
    description: >-
      Tell the agent to zoom out and give broader context or a higher-level perspective. Use when you're unfamiliar with a section of code or need to understand how it fits into the bigger picture.
  - name: caveman
    path: skills/caveman/SKILL.md
    description: >
      Ultra-compressed communication mode. Cuts token usage ~75% by dropping filler, articles, and pleasantries while keeping full technical accuracy. Use when user says "caveman mode", "talk like caveman", "use caveman", "less tokens", "be brief", or invokes /caveman.
  - name: grill-me
    path: skills/grill-me/SKILL.md
    description: >-
      Interview the user relentlessly about a plan or design until reaching shared understanding, resolving each branch of the decision tree. Use when user wants to stress-test a plan, get grilled on their design, or mentions "grill me".
  - name: handoff
    path: skills/handoff/SKILL.md
    description: >-
      Compact the current conversation into a handoff document for another agent to pick up.
  - name: teach
    path: skills/teach/SKILL.md
    description: >-
      Teach the user a new skill or concept, within this workspace.
  - name: write-a-skill
    path: skills/write-a-skill/SKILL.md
    description: >-
      Create new agent skills with proper structure, progressive disclosure, and bundled resources. Use when user wants to create, write, or build a new skill.
  - name: git-guardrails-claude-code
    path: skills/git-guardrails-claude-code/SKILL.md
    description: >-
      Set up Claude Code hooks to block dangerous git commands (push, reset --hard, clean, branch -D, etc.) before they execute. Use when user wants to prevent destructive git operations, add git safety hooks, or block git push/reset in Claude Code.
    scripts:
      - path: skills/git-guardrails-claude-code/scripts/block-dangerous-git.sh
  - name: migrate-to-shoehorn
    path: skills/migrate-to-shoehorn/SKILL.md
    description: >-
      Migrate test files from `as` type assertions to @total-typescript/shoehorn. Use when user mentions shoehorn, wants to replace `as` in tests, or needs partial test data.
  - name: scaffold-exercises
    path: skills/scaffold-exercises/SKILL.md
    description: >-
      Create exercise directory structures with sections, problems, solutions, and explainers that pass linting. Use when user wants to scaffold exercises, create exercise stubs, or set up a new course section.
  - name: setup-pre-commit
    path: skills/setup-pre-commit/SKILL.md
    description: >-
      Set up Husky pre-commit hooks with lint-staged (Prettier), type checking, and tests in the current repo. Use when user wants to add pre-commit hooks, set up Husky, configure lint-staged, or add commit-time formatting/typechecking/testing.
