name: "@forgecat/colbymchenry_codegraph"
version: 0.0.0
description: Local-first semantic code intelligence through the CodeGraph MCP server. Indexes codebases with tree-sitter and exposes symbols, relationships, traces, impact analysis, and focused source context to AI coding agents.
repository: https://github.com/colbymchenry/codegraph
license: MIT
visibility: public
sourcePlatform: multi-host
compatibility:
  platforms:
    tested:
      - claude-code
      - codex
      - cursor
    partial: []
  models:
    recommended: []
    minimum: []
platforms:
  cursor:
    mode: override
mcp:
  path: mcp.jsonc
