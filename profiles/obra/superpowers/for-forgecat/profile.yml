name: "@forgecat/obra_superpowers"
version: 0.0.10
description: Superpowers software development methodology for coding agents, including planning, TDD, debugging, subagent execution, review, and session-start skill bootstrap hooks.
repository: https://github.com/obra/superpowers
license: MIT
visibility: public
sourcePlatform: claude-code
compatibility:
  platforms:
    tested:
      - claude-code
      - cursor
      - codex
  models:
    recommended: []
    minimum: []
skills:
- name: brainstorming
  path: skills/brainstorming/SKILL.md
  description: Use before creative or product work to explore intent, requirements, and design before implementation.
  scripts:
  - path: skills/brainstorming/scripts/helper.js
  - path: skills/brainstorming/scripts/start-server.sh
  - path: skills/brainstorming/scripts/stop-server.sh
- name: dispatching-parallel-agents
  path: skills/dispatching-parallel-agents/SKILL.md
  description: Use when two or more independent tasks can be delegated without shared state or sequential dependencies.
- name: executing-plans
  path: skills/executing-plans/SKILL.md
  description: Use when executing a written implementation plan in a separate session with review checkpoints.
- name: finishing-a-development-branch
  path: skills/finishing-a-development-branch/SKILL.md
  description: Use after implementation and passing tests to decide how to integrate, PR, merge, or clean up development work.
- name: receiving-code-review
  path: skills/receiving-code-review/SKILL.md
  description: Use when receiving review feedback to verify suggestions technically before implementing them.
- name: requesting-code-review
  path: skills/requesting-code-review/SKILL.md
  description: Use when completing tasks, major features, or pre-merge work to request focused code review.
- name: subagent-driven-development
  path: skills/subagent-driven-development/SKILL.md
  description: Use when executing implementation plans with independent tasks in the current session through fresh subagents and staged review.
- name: systematic-debugging
  path: skills/systematic-debugging/SKILL.md
  description: Use when encountering bugs, failures, or unexpected behavior to find root cause before proposing fixes.
  scripts:
  - path: skills/systematic-debugging/condition-based-waiting-example.ts
  - path: skills/systematic-debugging/find-polluter.sh
- name: test-driven-development
  path: skills/test-driven-development/SKILL.md
  description: Use when implementing any feature or bugfix to write a failing test before implementation.
- name: using-git-worktrees
  path: skills/using-git-worktrees/SKILL.md
  description: Use when starting feature work that needs isolation from the current workspace or before executing implementation plans.
- name: using-superpowers
  path: skills/using-superpowers/SKILL.md
  description: Establishes how to find and use Superpowers skills at the start of coding conversations.
- name: verification-before-completion
  path: skills/verification-before-completion/SKILL.md
  description: Use before claiming work is complete, fixed, or passing to require verification evidence first.
- name: writing-plans
  path: skills/writing-plans/SKILL.md
  description: Use when requirements are ready and a multi-step implementation plan should be written before code changes.
- name: writing-skills
  path: skills/writing-skills/SKILL.md
  description: Use when creating, editing, or verifying agent skills before deployment.
  scripts:
  - path: skills/writing-skills/render-graphs.js
hooks:
- id: superpowers-session-start
  trigger: session_start
  command: ./hooks/session-start.sh
  description: Injects the Superpowers using-superpowers bootstrap context at session start.
  platforms:
  - claude-code
  - cursor
  - codex
