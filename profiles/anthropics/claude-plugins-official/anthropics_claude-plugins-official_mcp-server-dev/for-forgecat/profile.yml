name: "@forgecat/anthropics_claude-plugins-official_mcp-server-dev"
description: Skills for designing and building MCP servers that work seamlessly with
  Claude — guides you through deployment models (remote HTTP, MCPB, local), tool design
  patterns, auth, and interactive MCP apps.
repository: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/mcp-server-dev
license: Apache-2.0
visibility: public
sourcePlatform: claude-code
compatibility:
  platforms:
    tested:
      - claude-code
      - cursor
      - codex
    partial:
      - openclaw
      - hermes
  models:
    recommended: []
    minimum: []
skills:
- name: build-mcp-app
  path: skills/build-mcp-app/SKILL.md
  description: This skill should be used when the user wants to build an "MCP app",
    add "interactive UI" or "widgets" to an MCP server, "render components in chat",
    build "MCP UI resources", make a tool that shows a "form", "picker", "dashboard"
    or "confirmation dialog" inline in the conversation, or mentions "apps SDK" in
    the context of MCP. Use AFTER the build-mcp-server skill has settled the deployment
    model, or when the user already knows they want UI widgets.
- name: build-mcp-server
  path: skills/build-mcp-server/SKILL.md
  description: This skill should be used when the user asks to "build an MCP server",
    "create an MCP", "make an MCP integration", "wrap an API for Claude", "expose
    tools to Claude", "make an MCP app", or discusses building something with the
    Model Context Protocol. It is the entry point for MCP server development — it
    interrogates the user about their use case, determines the right deployment model
    (remote HTTP, MCPB, local stdio), picks a tool-design pattern, and hands off to
    specialized skills.
- name: build-mcpb
  path: skills/build-mcpb/SKILL.md
  description: This skill should be used when the user wants to "package an MCP server",
    "bundle an MCP", "make an MCPB", "ship a local MCP server", "distribute a local
    MCP", discusses ".mcpb files", mentions bundling a Node or Python runtime with
    their MCP server, or needs an MCP server that interacts with the local filesystem,
    desktop apps, or OS and must be installable without the user having Node/Python
    set up.
