name: "@forgecat/anthropics_skills_xlsx"
version: 0.0.4
description: 'Use this skill any time a spreadsheet file is the primary input or output.
  This means any task where the user wants to: open, read, edit, or fix an existing
  .xlsx, .xlsm, .csv, or .tsv file (e.g., adding columns, computing formulas, formatting,
  charting, cleaning messy data); create a new spreadsheet from scratch or from other
  data sources; or convert between tabular file formats. Trigger especially when the
  user references a spreadsheet file by name or path — even casually (like "the xlsx
  in my downloads") — and wants something done to it or produced from it. Also trigger
  for cleaning or restructuring messy tabular data files (malformed rows, misplaced
  headers, junk data) into proper spreadsheets. The deliverable must be a spreadsheet
  file. Do NOT trigger when the primary deliverable is a Word document, HTML report,
  standalone Python script, database pipeline, or Google Sheets API integration, even
  if tabular data is involved.'
repository: https://github.com/anthropics/skills
license: LicenseRef-Anthropic-Terms
visibility: public
sourcePlatform: claude-code
compatibility:
  platforms:
    tested:
      - claude-code
      - cursor
      - codex
  models:
    recommended: []
    minimum: []
