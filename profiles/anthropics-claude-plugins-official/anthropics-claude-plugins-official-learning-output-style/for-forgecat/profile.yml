name: anthropics-claude-official-learning-output-style
version: 0.0.0
description: Interactive learning mode that requests meaningful code contributions
  at decision points (mimics the unshipped Learning output style)
repository: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/learning-output-style
license: Apache-2.0
visibility: public
compatibility:
  platforms:
    tested:
    - claude-code
    partial:
    - cursor
    - codex
  models:
    recommended: []
    minimum: []
hooks:
- name: sessionstart-1
  path: hooks-handlers/session-start.sh
  description: Learning mode hook that adds interactive learning instructions
  event: SessionStart
  matcher: '*'
  handlers:
  - type: command
    command: bash hooks-handlers/session-start.sh
