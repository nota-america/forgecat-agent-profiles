name: anthropics-claude-official-skill-creator
version: 0.0.0
description: Create new skills, improve existing skills, and measure skill performance.
  Use when users want to create a skill from scratch, update or optimize an existing
  skill, run evals to test a skill, or benchmark skill performance with variance analysis.
repository: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/skill-creator
license: Apache-2.0
visibility: public
compatibility:
  platforms:
    tested:
    - claude-code
    partial:
    - cursor
    - codex
  models:
    recommended: []
    minimum: []
skills:
- name: skill-creator
  path: skills/skill-creator/SKILL.md
  description: Create new skills, modify and improve existing skills, and measure
    skill performance. Use when users want to create a skill from scratch, update
    or optimize an existing skill, run evals to test a skill, benchmark skill performance
    with variance analysis, or optimize a skill's description for better triggering
    accuracy.
