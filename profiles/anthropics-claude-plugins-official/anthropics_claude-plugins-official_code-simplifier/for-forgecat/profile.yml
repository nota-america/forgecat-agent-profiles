name: anthropics_claude-plugins-official_code-simplifier
version: 0.0.1
description: Agent that simplifies and refines code for clarity, consistency, and
  maintainability while preserving functionality
repository: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/code-simplifier
license: Apache-2.0
visibility: public
compatibility:
  platforms:
    tested:
    - claude-code
    - codex
    partial:
    - cursor
  models:
    recommended: []
    minimum: []
agents:
- name: code-simplifier
  path: agents/code-simplifier.md
  description: Simplifies and refines code for clarity, consistency, and maintainability
    while preserving all functionality. Focuses on recently modified code unless instructed
    otherwise.
