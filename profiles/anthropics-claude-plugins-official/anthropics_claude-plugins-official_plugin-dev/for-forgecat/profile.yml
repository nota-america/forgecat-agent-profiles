name: anthropics_claude-plugins-official_plugin-dev
version: 0.0.1
description: Plugin development toolkit with skills for creating agents, commands,
  hooks, MCP integrations, and comprehensive plugin structure guidance
repository: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/plugin-dev
license: Apache-2.0
visibility: public
compatibility:
  platforms:
    tested:
    - claude-code
    partial:
    - cursor
    - codex
  models:
    recommended: []
    minimum: []
skills:
- name: agent-development
  path: skills/agent-development/SKILL.md
  description: This skill should be used when the user asks to "create an agent",
    "add an agent", "write a subagent", "agent frontmatter", "when to use description",
    "agent examples", "agent tools", "agent colors", "autonomous agent", or needs
    guidance on agent structure, system prompts, triggering conditions, or agent development
    best practices for Claude Code plugins.
- name: command-development
  path: skills/command-development/SKILL.md
  description: This skill should be used when the user asks to "create a slash command",
    "add a command", "write a custom command", "define command arguments", "use command
    frontmatter", "organize commands", "create command with file references", "interactive
    command", "use AskUserQuestion in command", or needs guidance on slash command
    structure, YAML frontmatter fields, dynamic arguments, bash execution in commands,
    user interaction patterns, or command development best practices for Claude Code.
- name: hook-development
  path: skills/hook-development/SKILL.md
  description: This skill should be used when the user asks to "create a hook", "add
    a PreToolUse/PostToolUse/Stop hook", "validate tool use", "implement prompt-based
    hooks", "use ${CLAUDE_PLUGIN_ROOT}", "set up event-driven automation", "block
    dangerous commands", or mentions hook events (PreToolUse, PostToolUse, Stop, SubagentStop,
    SessionStart, SessionEnd, UserPromptSubmit, PreCompact, Notification). Provides
    comprehensive guidance for creating and implementing Claude Code plugin hooks
    with focus on advanced prompt-based hooks API.
- name: mcp-integration
  path: skills/mcp-integration/SKILL.md
  description: This skill should be used when the user asks to "add MCP server", "integrate
    MCP", "configure MCP in plugin", "use .mcp.json", "set up Model Context Protocol",
    "connect external service", mentions "${CLAUDE_PLUGIN_ROOT} with MCP", or discusses
    MCP server types (SSE, stdio, HTTP, WebSocket). Provides comprehensive guidance
    for integrating Model Context Protocol servers into Claude Code plugins for external
    tool and service integration.
- name: plugin-settings
  path: skills/plugin-settings/SKILL.md
  description: This skill should be used when the user asks about "plugin settings",
    "store plugin configuration", "user-configurable plugin", ".local.md files", "plugin
    state files", "read YAML frontmatter", "per-project plugin settings", or wants
    to make plugin behavior configurable. Documents the .claude/plugin-name.local.md
    pattern for storing plugin-specific configuration with YAML frontmatter and markdown
    content.
- name: plugin-structure
  path: skills/plugin-structure/SKILL.md
  description: This skill should be used when the user asks to "create a plugin",
    "scaffold a plugin", "understand plugin structure", "organize plugin components",
    "set up plugin.json", "use ${CLAUDE_PLUGIN_ROOT}", "add commands/agents/skills/hooks",
    "configure auto-discovery", or needs guidance on plugin directory layout, manifest
    configuration, component organization, file naming conventions, or Claude Code
    plugin architecture best practices.
- name: skill-development
  path: skills/skill-development/SKILL.md
  description: This skill should be used when the user wants to "create a skill",
    "add a skill to plugin", "write a new skill", "improve skill description", "organize
    skill content", or needs guidance on skill structure, progressive disclosure,
    or skill development best practices for Claude Code plugins.
agents:
- name: agent-creator
  path: agents/agent-creator.md
  description: 'Use this agent when the user asks to "create an agent", "generate
    an agent", "build a new agent", "make me an agent that...", or describes agent
    functionality they need. Trigger when user wants to create autonomous agents for
    plugins. Examples: <example> Context: User wants to create a code review agent
    user: "Create an agent that reviews code for quality issues" assistant: "I''ll
    use the agent-creator agent to generate the agent configuration." <commentary>
    User requesting new agent creation, trigger agent-creator to generate it. </commentary>
    </example> <example> Context: User describes needed functionality user: "I need
    an agent that generates unit tests for my code" assistant: "I''ll use the agent-creator
    agent to create a test generation agent." <commentary> User describes agent need,
    trigger agent-creator to build it. </commentary> </example> <example> Context:
    User wants to add agent to plugin user: "Add an agent to my plugin that validates
    configurations" assistant: "I''ll use the agent-creator agent to generate a configuration
    validator agent." <commentary> Plugin development with agent addition, trigger
    agent-creator. </commentary> </example>'
- name: plugin-validator
  path: agents/plugin-validator.md
  description: 'Use this agent when the user asks to "validate my plugin", "check
    plugin structure", "verify plugin is correct", "validate plugin.json", "check
    plugin files", or mentions plugin validation. Also trigger proactively after user
    creates or modifies plugin components. Examples: <example> Context: User finished
    creating a new plugin user: "I''ve created my first plugin with commands and hooks"
    assistant: "Great! Let me validate the plugin structure." <commentary> Plugin
    created, proactively validate to catch issues early. </commentary> assistant:
    "I''ll use the plugin-validator agent to check the plugin." </example> <example>
    Context: User explicitly requests validation user: "Validate my plugin before
    I publish it" assistant: "I''ll use the plugin-validator agent to perform comprehensive
    validation." <commentary> Explicit validation request triggers the agent. </commentary>
    </example> <example> Context: User modified plugin.json user: "I''ve updated the
    plugin manifest" assistant: "Let me validate the changes." <commentary> Manifest
    modified, validate to ensure correctness. </commentary> assistant: "I''ll use
    the plugin-validator agent to check the manifest." </example>'
- name: skill-reviewer
  path: agents/skill-reviewer.md
  description: 'Use this agent when the user has created or modified a skill and needs
    quality review, asks to "review my skill", "check skill quality", "improve skill
    description", or wants to ensure skill follows best practices. Trigger proactively
    after skill creation. Examples: <example> Context: User just created a new skill
    user: "I''ve created a PDF processing skill" assistant: "Great! Let me review
    the skill quality." <commentary> Skill created, proactively trigger skill-reviewer
    to ensure it follows best practices. </commentary> assistant: "I''ll use the skill-reviewer
    agent to review the skill." </example> <example> Context: User requests skill
    review user: "Review my skill and tell me how to improve it" assistant: "I''ll
    use the skill-reviewer agent to analyze the skill quality." <commentary> Explicit
    skill review request triggers the agent. </commentary> </example> <example> Context:
    User modified skill description user: "I updated the skill description, does it
    look good?" assistant: "I''ll use the skill-reviewer agent to review the changes."
    <commentary> Skill description modified, review for triggering effectiveness.
    </commentary> </example>'
commands:
- name: create-plugin
  path: commands/create-plugin.md
  description: Guided end-to-end plugin creation workflow with component design, implementation,
    and validation
