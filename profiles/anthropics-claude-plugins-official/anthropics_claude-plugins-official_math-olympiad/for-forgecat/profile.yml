name: anthropics_claude-plugins-official_math-olympiad
version: 0.0.0
description: Solve competition math (IMO, Putnam, USAMO) with adversarial verification
  that catches what self-verification misses. Fresh-context verifiers attack proofs
  with specific failure patterns. Calibrated abstention over bluffing.
repository: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/math-olympiad
license: Apache-2.0
visibility: public
compatibility:
  platforms:
    tested:
    - claude-code
    partial:
    - cursor
    - codex
  models:
    recommended: []
    minimum: []
skills:
- name: math-olympiad
  path: skills/math-olympiad/SKILL.md
  description: Solve competition math problems (IMO, Putnam, USAMO, AIME) with adversarial
    verification that catches the errors self-verification misses. Activates when
    asked to 'solve this IMO problem', 'prove this olympiad inequality', 'verify this
    competition proof', 'find a counterexample', 'is this proof correct', or for any
    problem with 'IMO', 'Putnam', 'USAMO', 'olympiad', or 'competition math' in it.
    Uses pure reasoning (no tools) — then a fresh-context adversarial verifier attacks
    the proof using specific failure patterns, not generic 'check logic'. Outputs
    calibrated confidence — will say 'no confident solution' rather than bluff. If
    LaTeX is available, produces a clean PDF after verification passes.
