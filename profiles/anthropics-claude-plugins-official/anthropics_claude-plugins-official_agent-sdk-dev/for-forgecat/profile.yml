name: anthropics_claude-plugins-official_agent-sdk-dev
version: 0.0.0
description: Claude Agent SDK Development Plugin
repository: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/agent-sdk-dev
license: Apache-2.0
visibility: public
compatibility:
  platforms:
    tested:
    - claude-code
    partial:
    - cursor
    - codex
  models:
    recommended: []
    minimum: []
agents:
- name: agent-sdk-verifier-py
  path: agents/agent-sdk-verifier-py.md
  description: Use this agent to verify that a Python Agent SDK application is properly
    configured, follows SDK best practices and documentation recommendations, and
    is ready for deployment or testing. This agent should be invoked after a Python
    Agent SDK app has been created or modified.
- name: agent-sdk-verifier-ts
  path: agents/agent-sdk-verifier-ts.md
  description: Use this agent to verify that a TypeScript Agent SDK application is
    properly configured, follows SDK best practices and documentation recommendations,
    and is ready for deployment or testing. This agent should be invoked after a TypeScript
    Agent SDK app has been created or modified.
commands:
- name: new-sdk-app
  path: commands/new-sdk-app.md
  description: Create and setup a new Claude Agent SDK application
