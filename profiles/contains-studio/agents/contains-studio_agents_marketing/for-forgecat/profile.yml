agents:
- name: app-store-optimizer
  path: agents/app-store-optimizer.md
  description: 'Use this agent when preparing app store listings, researching keywords, optimizing app metadata, improving conversion rates, or analyzing app store performance. This agent specializes in maximizing organic app store visibility and downloads. Examples:\n\n<example>\nContext: Preparing for app launch

    user: "We''re launching our meditation app next week. The listing needs work"\nassistant: "I''ll optimize your app store presence for maximum visibility. Let me use the app-store-optimizer agent to research keywords and craft the perfect listing."\n<commentary>\nPre-launch ASO optimization is crucial for organic discovery from day one.\n</commentary>\n</example>\n\n<example>\nContext: Improving existing app performance

    user: "Our downloads have plateaued despite good reviews"\nassistant: "Your app might have visibility issues. I''ll use the app-store-optimizer agent to analyze your current ASO and identify improvement opportunities."\n<commentary>\nGood apps can fail due to poor app store optimization, limiting organic discovery.\n</commentary>\n</example>\n\n<example>\nContext: Researching competitive keywords

    user: "What keywords should we target for our phone anxiety app?"\nassistant: "Keyword research is crucial for ASO. Let me use the app-store-optimizer agent to find high-volume, low-competition keywords perfect for your app."\n<commentary>\nThe right keywords can dramatically increase organic traffic and downloads.\n</commentary>\n</example>\n\n<example>\nContext: A/B testing app store elements

    user: "Should we change our app icon? Users say it''s boring"\nassistant: "Let''s test that systematically. I''ll use the app-store-optimizer agent to set up A/B tests for your icon and measure conversion impact."\n<commentary>\nApp store elements should be tested, not changed based on opinions alone.\n</commentary>\n</example>'
- name: content-creator
  path: agents/content-creator.md
  description: The Content Creator specializes in cross-platform content generation, from long-form blog posts to engaging video scripts and social media content. This agent understands how to adapt messaging across different formats while maintaining brand consistency and maximizing impact for each platform's unique requirements.
- name: growth-hacker
  path: agents/growth-hacker.md
  description: The Growth Hacker specializes in rapid user acquisition, viral loop creation, and data-driven growth experiments. This agent combines marketing, product, and data analysis skills to identify and exploit growth opportunities, creating scalable systems that drive exponential user growth.
- name: instagram-curator
  path: agents/instagram-curator.md
  description: The Instagram Curator specializes in visual content strategy, Stories, Reels, and Instagram growth tactics. This agent understands the platform's algorithm, visual aesthetics, and engagement patterns to create compelling content strategies that drive followers, engagement, and conversions.
- name: reddit-community-builder
  path: agents/reddit-community-builder.md
  description: The Reddit Community Builder specializes in authentic community engagement, organic growth through valuable participation, and navigating Reddit's unique culture. This agent understands the importance of providing value first, building genuine relationships, and respecting community norms while strategically growing brand presence.
- name: tiktok-strategist
  path: agents/tiktok-strategist.md
  description: 'Use this agent when you need to create TikTok marketing strategies, develop viral content ideas, plan TikTok campaigns, or optimize for TikTok''s algorithm. This agent specializes in creating shareable moments and leveraging TikTok trends for app growth. Examples:\n\n<example>\nContext: Launching a new app and need TikTok strategy\nuser: "We''re launching our phone anxiety app next week. How should we approach TikTok?"\nassistant: "TikTok will be crucial for your launch. Let me use the tiktok-strategist agent to create a comprehensive TikTok marketing strategy for your phone anxiety app."\n<commentary>\nNew app launches benefit from TikTok''s viral potential and young user base.\n</commentary>\n</example>\n\n<example>\nContext: Creating viral content for an existing app\nuser: "Our meditation app needs more downloads. What kind of TikTok content should we make?"\nassistant: "I''ll help you create viral TikTok content ideas. Let me use the tiktok-strategist agent to develop
    content that showcases your app in trending formats."\n<commentary>\nExisting apps can boost downloads through strategic TikTok content that fits platform culture.\n</commentary>\n</example>\n\n<example>\nContext: Identifying TikTok influencers for partnerships\nuser: "Should we work with TikTok creators to promote our app?"\nassistant: "Creator partnerships can be very effective. Let me use the tiktok-strategist agent to identify the right creators and collaboration strategies for your app."\n<commentary>\nInfluencer partnerships on TikTok can provide authentic reach to target audiences.\n</commentary>\n</example>\n\n<example>\nContext: Optimizing app features for TikTok sharing\nuser: "How can we make our app more TikTok-friendly?"\nassistant: "Making your app TikTok-native is smart. I''ll use the tiktok-strategist agent to identify features and moments in your app that users would want to share on TikTok."\n<commentary>\nApps with built-in TikTok-worthy moments see higher organic
    growth through user-generated content.\n</commentary>\n</example>'
- name: twitter-engager
  path: agents/twitter-engager.md
  description: The Twitter Engager specializes in real-time social media engagement, trending topic leverage, and viral tweet creation. This agent masters the art of concise communication, thread storytelling, and community building through strategic engagement on Twitter/X platform.
