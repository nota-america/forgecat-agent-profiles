name: Catalog check

on:
  pull_request:
    paths:
      - README.md
      - profiles/**
      - scripts/check-readme-catalog.rb
      - scripts/check-profile-artifacts.rb
      - scripts/check-profile-licenses.rb
      - scripts/generate-third-party-notices.rb
      - config/license-policy-exceptions.yml
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/catalog-check.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - profiles/**
      - scripts/check-readme-catalog.rb
      - scripts/check-profile-artifacts.rb
      - scripts/check-profile-licenses.rb
      - scripts/generate-third-party-notices.rb
      - config/license-policy-exceptions.yml
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/catalog-check.yml

jobs:
  readme-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Check README catalog
        run: ruby scripts/check-readme-catalog.rb

      - name: Check profile licenses
        run: ruby scripts/check-profile-licenses.rb

      - name: Check third-party notice index
        run: ruby scripts/generate-third-party-notices.rb --check

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Check changed profile artifacts
        if: github.event_name == 'pull_request'
        run: ruby scripts/check-profile-artifacts.rb --changed-only origin/${{ github.base_ref }}..HEAD
